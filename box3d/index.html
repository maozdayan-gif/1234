<title>Écrin 3D Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: full-bleed WebGL stage; a thin control rail floats at the bottom. Single dark look by design. */
:root{
  --ink:#0b0a09; --text:#ece4d6; --muted:#9a9184; --brass:#c8a66b; --brass-hi:#ecd5a2; --line:rgba(236,226,208,.16); --glass:rgba(16,14,12,.72);
  --display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif; --body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--text)}
body{margin:0;overflow:hidden;font:300 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 38%,#26201a 0%,#14110e 45%,#080706 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:20px;right:20px;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none;gap:12px}
.brand b{font:500 12px/1 var(--body);letter-spacing:.42em;text-transform:uppercase}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
.rail{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;
  padding:8px 12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 24px);border-radius:2px}
.rail button{font:400 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:9px 6px;cursor:pointer}
.rail button[aria-pressed="true"]{color:var(--brass-hi)}
.rail button:hover{color:var(--text)}
.rail .open{color:var(--ink);background:linear-gradient(180deg,var(--brass-hi),var(--brass));padding:10px 16px;border-radius:1px}
.rail .open:hover{color:var(--ink);filter:brightness(1.08)}
.rail .sep{width:1px;height:18px;background:var(--line)}
.dot{width:16px;height:16px;border-radius:50%;padding:0!important;border:1px solid var(--line)!important;background:var(--c)!important}
.dot[aria-pressed="true"]{outline:1px solid var(--brass-hi);outline-offset:3px}
.rail input{width:52px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:500 13px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:6px 0}
.rail input:focus{outline:none;border-color:var(--brass)}
:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
.card{text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.8);position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;pointer-events:none;transition:opacity .4s;width:calc(100% - 32px)}
.card .k{font:400 11px/1.3 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
.card .n{font:500 clamp(24px,4.4vw,36px)/1.1 var(--display);margin-top:6px}
.card .s{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .6s;white-space:nowrap}
.veil{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);transition:opacity .9s;pointer-events:none}
.veil i{width:26px;height:26px;border:1px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin 1s linear infinite}
.veil p{position:absolute;top:58%;font-size:13px;color:var(--muted);max-width:34ch;text-align:center;padding:0 16px}
@keyframes spin{to{transform:rotate(1turn)}}
[hidden]{display:none!important}
@media (max-width:560px){.rail{gap:4px 8px;padding:6px 8px}.rail .sep{display:none}.brand span{display:none}}
</style>

<div id="stage"></div>
<div class="brand"><b>Écrin</b><span id="tip">Drag to turn · Pinch to look closer · Tap a watch</span></div>

  <button class="dot" data-lining="tobacco" style="--c:#5a3d26" aria-label="Tobacco lining"></button>

</div>

<script type="module">
import * as THREE from "three";

/* ============ configuration (units: centimetres) ============ */
const LAYOUTS = { 6:{cols:3,rows:2}, 8:{cols:4,rows:2}, 12:{cols:6,rows:2} };

/* Demo collection: generic styles, no brand marks */
const WATCHES = [
  {k:"Diver",          n:"Black dial, ceramic bezel", metal:"steel", dial:{base:"#0b0c0e", style:"dots", lume:"#f2efe2", ind:"#d9dde2"}, bezel:{kind:"diver", a:"#0d0e10", b:"#0d0e10", ink:"#d8d8d0"}, band:"bracelet"},
  {k:"Chronograph",    n:"Panda dial",                metal:"steel", dial:{base:"#ecebe6", style:"baton", ind:"#9aa0a8", sub:"#111214", subInk:"#e8e6df"}, bezel:{kind:"tachy", a:"#121315", b:"#121315", ink:"#e9e7e0"}, band:"bracelet"},
  {k:"Dress",          n:"Ivory dial, yellow gold",   metal:"gold",  dial:{base:"#efe6d2", style:"roman", ind:"#8a6a2e"}, band:"leather", strap:"#4a2a17"},
  {k:"Sports",         n:"Blue sunburst",             metal:"steel", dial:{base:"#123a7a", base2:"#08214b", sun:true, style:"baton", ind:"#e6e9ee"}, band:"bracelet", date:true},
  {k:"Diver",          n:"Green dial",                metal:"steel", dial:{base:"#0f3b26", base2:"#082416", sun:true, style:"dots", lume:"#eef0dc", ind:"#d9dde2"}, bezel:{kind:"diver", a:"#0e3a24", b:"#0e3a24", ink:"#d9dbc8"}, band:"bracelet", date:true},
  {k:"Pilot",          n:"Matte black, arabic",       metal:"steel", dial:{base:"#141414", style:"arabic", ind:"#f0ede4"}, band:"leather", strap:"#6b4528"},
  {k:"GMT",            n:"Blue and red bezel",        metal:"steel", dial:{base:"#0c0d10", style:"dots", lume:"#f2efe2", ind:"#d9dde2"}, bezel:{kind:"gmt", a:"#8e1b22", b:"#1c2f6b", ink:"#ecebe4"}, band:"bracelet", date:true},
  null,
  {k:"Dress",          n:"Salmon dial, rose gold",    metal:"rose",  dial:{base:"#e8b8a0", base2:"#d79d83", sun:true, style:"baton", ind:"#8c5a44"}, band:"leather", strap:"#16120f"},
  {k:"Sports",         n:"Slate grey",                metal:"steel", dial:{base:"#4b5056", base2:"#33373c", sun:true, style:"baton", ind:"#eef0f2"}, band:"bracelet"},
  {k:"Field",          n:"Cream dial",                metal:"steel", dial:{base:"#e7e1cf", style:"arabic", ind:"#202020"}, band:"leather", strap:"#3a3f2c"},
  {k:"Diver",          n:"Black dial, yellow gold",   metal:"gold",  dial:{base:"#0b0b0c", style:"dots", lume:"#f2efe2", ind:"#e2bf72"}, bezel:{kind:"diver", a:"#0d0d0f", b:"#0d0d0f", ink:"#e6c98a"}, band:"bracelet"}
];

/* ============ renderer, scene, camera ============ */
const stage = document.getElementById("stage");
const veil = document.getElementById("veil");
const isSmall = Math.min(innerWidth, innerHeight) < 700;
const coarse = matchMedia("(pointer: coarse)").matches;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
// Dark photo studio: black room, a few softboxes. Gives lacquer and metal the crisp light/dark reflections of product photography.
function studioEnvironment(){
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(120, 70, 120), new THREE.MeshBasicMaterial({ color:0x0b0907, side:THREE.BackSide })));
  const floorM = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ color:0x15100b })); floorM.rotation.x = -Math.PI / 2; floorM.position.y = -20; s.add(floorM);
  const panel = (w, h, pos, k, col = 0xffffff) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color:new THREE.Color(col).multiplyScalar(k), side:THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m); };
  panel(46, 22, [0, 32, 6], 5.5, 0xfff3e2);      // overhead softbox
  panel(10, 46, [-50, 12, 14], 3.2, 0xfff0dc);   // left strip
  panel(10, 46, [50, 10, -6], 2.0, 0xe6eeff);    // right strip, cooler
  panel(70, 7, [0, 8, -54], 1.6, 0xffd7a8);      // warm back rim
  panel(34, 10, [0, 14, 54], 0.9);               // soft front fill
  return pmrem.fromScene(s, 0.015).texture;
}
scene.environment = studioEnvironment();
scene.environmentIntensity = 1.0;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.7;
controls.minPolarAngle = THREE.MathUtils.degToRad(6);
controls.maxPolarAngle = THREE.MathUtils.degToRad(80);
controls.minAzimuthAngle = THREE.MathUtils.degToRad(-80);
controls.maxAzimuthAngle = THREE.MathUtils.degToRad(80);

const key = new THREE.DirectionalLight(0xfff1dc, 1.7);
key.position.set(-16, 46, 26);
key.castShadow = true;
key.shadow.mapSize.set((isSmall || coarse) ? 1024 : 2048, (isSmall || coarse) ? 1024 : 2048);
Object.assign(key.shadow.camera, { left:-34, right:34, top:34, bottom:-34, near:10, far:120 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7); rim.position.set(24, 20, -34); scene.add(rim);
const fill = new THREE.HemisphereLight(0xfff4e6, 0x1a120c, 0.25); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity:0.55 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

/* ============ procedural textures ============ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvas(w, h){ const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function tex(c, { srgb = true, repeat = null } = {}){
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, maxAniso);
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }

}
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function periodicNoise(period, seed){
  const r = rng(seed); const v = Array.from({ length: period }, r);
  return x => { const i = Math.floor(x), f = x - i, a = v[((i % period) + period) % period], b = v[(((i + 1) % period) + period) % period]; const t = f * f * (3 - 2 * f); return a + (b - a) * t; };
}

// Macassar-ebony style veneer: irregular dark stripes over warm brown, tileable in both directions.
function woodTexture(){
  const W = 512, H = 1024, c = canvas(W, H), g = c.getContext("2d"), img = g.createImageData(W, H), d = img.data;
  const n1 = periodicNoise(28, 7), n2 = periodicNoise(64, 19), n3 = periodicNoise(16, 3), r = rng(42);
  const light = [74, 42, 21], mid = [40, 22, 11], dark = [15, 8, 5];
  for (let y = 0; y < H; y++){
    const yy = y / H;
    for (let x = 0; x < W; x++){
      const xx = x / W;
      const warp = 0.55 * Math.sin(yy * Math.PI * 2 + n3(xx * 16) * 1.5) + 0.25 * Math.sin(yy * Math.PI * 6 + xx * 9);
      const u = xx * 28 + warp;
      let v = n1(u) * 0.55 + n2(u * 64 / 28) * 0.45;
      v = Math.min(1, Math.max(0, (v - 0.3) * 1.7));
      const fine = (n2(xx * 64 * 1 + Math.sin(yy * Math.PI * 2) * 0.4) - 0.5) * 0.22 + (r() - 0.5) * 0.05;
      const t = Math.min(1, Math.max(0, v + fine));
      const col = t < 0.5 ? mix(light, mid, t * 2) : mix(mid, dark, (t - 0.5) * 2);
      const i = (y * W + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function mix(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  const c = canvas(size, size), g = c.getContext("2d"), img = g.createImageData(size, size), r = rng(seed);
  for (let i = 0; i < img.data.length; i += 4){ const v = 128 + (r() - 0.5) * amp; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
}

// Watch dial, drawn on a 1024 canvas. 12 o'clock is the top of the canvas.
function dialCanvas(o, date){
  const S = 1024, R = S / 2, c = canvas(S, S), g = c.getContext("2d");
  g.translate(R, R);
  if (o.sun && g.createConicGradient){
    const cg = g.createConicGradient(0, 0, 0);
    for (let i = 0; i <= 36; i++) cg.addColorStop(i / 36, i % 2 ? o.base : (o.base2 || o.base));
    g.fillStyle = cg;
  } else g.fillStyle = o.base;
  g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
  const rg = g.createRadialGradient(0, -R * 0.25, R * 0.1, 0, 0, R);
  rg.addColorStop(0, "rgba(255,255,255,0.07)"); rg.addColorStop(0.75, "rgba(0,0,0,0)"); rg.addColorStop(1, "rgba(0,0,0,0.45)");

  const lightDial = luminance(o.base) > 0.45;
  const trackCol = lightDial ? "rgba(20,20,20,0.75)" : "rgba(235,235,230,0.75)";
  for (let i = 0; i < 60; i++){ g.save(); g.rotate(i * Math.PI / 30); g.fillStyle = trackCol; const big = i % 5 === 0; g.fillRect(big ? -3 : -1.6, -R * 0.965, big ? 6 : 3.2, R * (big ? 0.055 : 0.035)); g.restore(); }

    const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
    gr.addColorStop(0, shade(o.ind, -0.35)); gr.addColorStop(0.45, shade(o.ind, 0.35)); gr.addColorStop(0.55, o.ind); gr.addColorStop(1, shade(o.ind, -0.45));

    g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 2; g.strokeRect(-w / 2, -rIn - h, w, h);
  };
  for (let h = 0; h < 12; h++){
    if (date && h === 3) continue;
    if (o.sub && (h === 3 || h === 6 || h === 9)) continue;
    g.save(); g.rotate(h * Math.PI / 6);
    if (o.style === "dots"){
      if (h === 0){ g.beginPath(); g.moveTo(0, -R * 0.66); g.lineTo(-R * 0.085, -R * 0.86); g.lineTo(R * 0.085, -R * 0.86); g.closePath(); g.fillStyle = o.ind; g.fill(); g.beginPath(); g.moveTo(0, -R * 0.69); g.lineTo(-R * 0.06, -R * 0.835); g.lineTo(R * 0.06, -R * 0.835); g.closePath(); g.fillStyle = o.lume; g.fill(); }
      else if (h === 6 || h === 9 || h === 3){ applied(R * 0.075, R * 0.2, R * 0.66); g.fillStyle = o.lume; g.fillRect(-R * 0.026, -R * 0.84, R * 0.052, R * 0.16); }
      else { g.beginPath(); g.arc(0, -R * 0.77, R * 0.068, 0, Math.PI * 2); g.fillStyle = o.ind; g.fill(); g.beginPath(); g.arc(0, -R * 0.77, R * 0.05, 0, Math.PI * 2); g.fillStyle = o.lume; g.fill(); }
    } else if (o.style === "baton"){
      applied(h === 0 ? R * 0.1 : R * 0.05, R * 0.2, R * 0.66);
    } else if (o.style === "roman" || o.style === "arabic"){
      g.rotate(-h * Math.PI / 6);
      const a = h * Math.PI / 6, rr = R * 0.74;
      const txt = o.style === "roman" ? ["XII","I","II","III","IIII","V","VI","VII","VIII","IX","X","XI"][h] : String(h === 0 ? 12 : h);
      g.fillStyle = o.ind;
      g.font = o.style === "roman" ? `500 ${R * 0.15}px "Bodoni Moda", Georgia, serif` : `500 ${R * 0.19}px "Jost", "Futura", sans-serif`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(txt, Math.sin(a) * rr, -Math.cos(a) * rr);
    }
    g.restore();
  }
  if (o.sub){
    for (const [x, y] of [[-R * 0.42, 0], [R * 0.42, 0], [0, R * 0.42]]){
      g.beginPath(); g.arc(x, y, R * 0.2, 0, Math.PI * 2); g.fillStyle = o.sub; g.fill();
      g.strokeStyle = shade(o.ind, 0.2); g.lineWidth = 5; g.stroke();
      for (let i = 0; i < 12; i++){ const a = i * Math.PI / 6; g.fillStyle = o.subInk; g.fillRect(x + Math.sin(a) * R * 0.15 - 2, y - Math.cos(a) * R * 0.15 - 2, 4, 4); }

    }
  }
  if (date){
    g.fillStyle = "#f4f2ea"; g.fillRect(R * 0.58, -R * 0.075, R * 0.18, R * 0.15);
    g.strokeStyle = shade(o.ind, -0.2); g.lineWidth = 5; g.strokeRect(R * 0.58, -R * 0.075, R * 0.18, R * 0.15);
    g.fillStyle = "#111"; g.font = `500 ${R * 0.11}px "Jost", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("6", R * 0.67, R * 0.005);
  }
  g.fillStyle = lightDial ? "rgba(25,25,25,0.8)" : "rgba(235,232,224,0.82)";
  g.font = `400 ${R * 0.05}px "Jost", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  if (!o.sub) g.fillText("A U T O M A T I C", 0, R * 0.36);
  return c;
}
function bezelCanvas(o){
  const S = 1024, R = S / 2, c = canvas(S, S), g = c.getContext("2d"); g.translate(R, R);
  const rIn = R * (1.72 / 2.04);

  plaque.position.set(0, BASE_H * 0.5, OD / 2 + 0.06);
  const latch = mesh(new RoundedBoxGeometry(2.0, 1.1, 0.3, 2, 0.1), M.brass); latch.position.set(0, BASE_H - 0.5, OD / 2 + 0.1);
  for (const sx of [-1, 1]){
    const hinge = mesh(new THREE.CylinderGeometry(0.34, 0.34, 3.6, 24), M.brass); hinge.rotation.z = Math.PI / 2; hinge.position.set(sx * OW * 0.3, BASE_H + 0.05, -OD / 2 - 0.05);
    const leaf = mesh(new RoundedBoxGeometry(3.4, 1.2, 0.08, 1, 0.03), M.brass); leaf.position.set(sx * OW * 0.3, BASE_H - 0.6, -OD / 2 - 0.02);
  }
  // lid: pivots on the back top edge
  lid = new THREE.Group(); lid.position.set(0, BASE_H + 0.05, -OD / 2);
  const lidBody = new THREE.Group(); lidBody.position.z = OD / 2; lid.add(lidBody);
  mesh(frameGeometry(OW, OD, OW - 2 * LID_RAIL, OD - 2 * LID_RAIL, LID_H), M.wood, lidBody);
  const glass = mesh(new THREE.BoxGeometry(OW - 2 * LID_RAIL + 0.6, 0.22, OD - 2 * LID_RAIL + 0.6), M.glass, lidBody); glass.position.y = LID_H * 0.62; glass.castShadow = false; glass.renderOrder = 3;
  const lidLatch = mesh(new RoundedBoxGeometry(2.0, 0.7, 0.3, 2, 0.1), M.brass, lidBody); lidLatch.position.set(0, 0.45, OD / 2 + 0.1);
  for (const sx of [-1, 1]){ const leaf = mesh(new RoundedBoxGeometry(3.4, 1.0, 0.08, 1, 0.03), M.brass, lidBody); leaf.position.set(sx * OW * 0.3, 0.55, -OD / 2 - 0.02); }
  box.add(lid);
  lid.rotation.x = state.open ? OPEN_ANGLE : 0;
  scene.add(box);
  setLining(state.lining);
  frame(false);
}
const OPEN_ANGLE = THREE.MathUtils.degToRad(-104);
function setLining(k){ state.lining = k; const l = LININGS[k]; M.lining.color.set(l.color); M.lining.sheenColor.set(l.sheen); requestRender(); }
function setInitials(t){
  state.initials = t; if (!plaqueMat) return;
  plaqueMat.map.dispose(); plaqueMat.map = tex(plaqueCanvas(t)); plaqueMat.needsUpdate = true; requestRender();
}

/* ============ camera framing ============ */
function fitDistance(width, height){
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  return Math.max(width / 2 / Math.tan(hf), height / 2 / Math.tan(vf));
}
function views(){
  const { OW, OD } = box.userData;
  const open = state.open;
  const target = new THREE.Vector3(0, open ? BASE_H * 0.5 + OD * 0.14 : BASE_H * 0.55, open ? -OD * 0.04 : 0);
  const d = fitDistance(OW * (camera.aspect < 0.8 ? 1.06 : 1.18), (open ? OD * 1.25 + BASE_H : OD * 0.8 + BASE_H) * 1.2) * (camera.aspect < 0.8 ? 1.04 : 1);
  const polar = THREE.MathUtils.degToRad(open ? 36 : 56), az = THREE.MathUtils.degToRad(open ? -6 : -22);
  const pos = new THREE.Vector3().setFromSphericalCoords(d, polar, az).add(target);
  return { target, pos, d };
}
function frame(animate = true, dur = 1.6){
  const v = views();
  controls.minDistance = v.d * 0.28; controls.maxDistance = v.d * 1.7;
  if (!animate){ camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); requestRender(); return; }
  flyTo(v.pos, v.target, dur);
}
function flyTo(pos, target, dur){
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  // move on a sphere around the target for a smooth arc rather than a straight dolly
  const s0 = new THREE.Spherical().setFromVector3(p0.clone().sub(t0)), s1 = new THREE.Spherical().setFromVector3(pos.clone().sub(target));
  tween(dur, easeInOut, k => {
    const tg = t0.clone().lerp(target, k);
    const s = new THREE.Spherical(THREE.MathUtils.lerp(s0.radius, s1.radius, k), THREE.MathUtils.lerp(s0.phi, s1.phi, k), THREE.MathUtils.lerp(s0.theta, s1.theta, k));
    controls.target.copy(tg); camera.position.setFromSpherical(s).add(tg);
  });
}

/* ============ animation ============ */
const tweens = [];
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, ease, fn, done){ if (reduceMotion) dur = Math.min(dur, 0.01); tweens.push({ t0:performance.now(), dur:dur * 1000, ease, fn, done }); requestRender(); }
// lid swing with a soft damped settle at the stay
const lidEase = t => { if (t < 0.78) return easeInOut(t / 0.78) * 1.035; const u = (t - 0.78) / 0.22; return 1.035 - 0.035 * easeOut(u); };
function setOpen(open){
  if (state.focus) unfocus(true);
  state.open = open; document.getElementById("b-open").textContent = open ? "Close" : "Open";
  hideHint();
  const a0 = lid.rotation.x, a1 = open ? OPEN_ANGLE : 0;
  tween(open ? 2.4 : 1.6, open ? lidEase : easeInOut, k => { lid.rotation.x = a0 + (a1 - a0) * k; });
  frame(true, open ? 2.4 : 1.6);
}

/* ============ inspect a watch ============ */
const card = document.getElementById("card");
function focusCell(cell){
  if (!state.open) return setOpen(true);
  if (state.focus === cell) return unfocus();
  if (state.focus) unfocus(true);
  state.focus = cell;
  const w = cell.userData.watch, cu = cell.userData.cushion;
  const lift = 2.6, tilt = 0.34;
  tween(0.9, easeInOut, k => { cu.position.y = CUSH_Y + lift * k; cu.rotation.x = tilt * k; });
  const world = new THREE.Vector3(); cell.getWorldPosition(world); world.y = CUSH_Y + lift + 1.2;
  const pos = new THREE.Vector3().setFromSphericalCoords(fitDistance(17, 15), THREE.MathUtils.degToRad(44), THREE.MathUtils.degToRad(0)).add(world);
  flyTo(pos, world, 1.2);
  document.getElementById("card-k").textContent = w.k;
  document.getElementById("card-n").textContent = w.n;
  document.getElementById("card-s").textContent = `Compartment ${cell.userData.slot + 1} · ${w.metal === "steel" ? "Steel" : w.metal === "gold" ? "Yellow gold" : "Rose gold"} · ${w.band === "leather" ? "Leather strap" : "Bracelet"}`;
  card.style.opacity = 1;
}
function unfocus(quiet){
  const cell = state.focus; if (!cell) return; state.focus = null; card.style.opacity = 0;
  const cu = cell.userData.cushion, y0 = cu.position.y, r0 = cu.rotation.x;
  tween(0.8, easeInOut, k => { cu.position.y = y0 + (CUSH_Y - y0) * k; cu.rotation.x = r0 * (1 - k); });
  if (!quiet) frame(true, 1.1);
}

/* ============ picking ============ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); const quick = performance.now() - down.t < 450; down = null;
  if (moved > 6 || !quick) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(box, true).filter(h => h.object.material !== M.glass && h.object.material !== M.crystal);
  if (!hits.length){ if (state.focus) unfocus(); return; }
  if (!state.open){ setOpen(true); return; }
  let o = hits[0].object; while (o && !(o.userData && "slot" in o.userData)) o = o.parent;
  if (o && o.userData.watch) focusCell(o);
  else if (state.focus) unfocus();
});

/* ============ render loop (renders only while something changes) ============ */
let dirty = true;
function requestRender(){ dirty = true; }
controls.addEventListener("change", requestRender);
controls.addEventListener("start", hideHint);
function loop(now){
  requestAnimationFrame(loop);
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const k = Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(tw.ease(k)); dirty = true;
    if (k >= 1){ tweens.splice(i, 1); tw.done && tw.done(); }
  }
  const moved = controls.update();
  if (dirty || moved){ renderer.render(scene, camera); dirty = false; }
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  if (!state.focus) frame(false); requestRender();
});

/* ============ UI ============ */
const hint = document.getElementById("hint");
let hintTimer = null;
function hideHint(){ hint.style.opacity = 0; clearTimeout(hintTimer); }
document.getElementById("b-open").addEventListener("click", () => setOpen(!state.open));
document.getElementById("b-reset").addEventListener("click", () => { if (state.focus) unfocus(true); frame(true, 1.1); });
document.querySelectorAll("[data-layout]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-layout]").forEach(x => x.setAttribute("aria-pressed", x === b)); state.focus = null; card.style.opacity = 0;
  state.layout = +b.dataset.layout; buildBox(); frame(false);
}));
document.querySelectorAll("[data-lining]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-lining]").forEach(x => x.setAttribute("aria-pressed", x === b)); setLining(b.dataset.lining);
}));
document.getElementById("initials").addEventListener("input", e => setInitials(e.target.value.toUpperCase().slice(0, 3)));
addEventListener("keydown", e => { if (e.key === "Escape" && state.focus) unfocus(); });

/* ============ start ============ */
async function start(){
  try { await Promise.race([Promise.all([document.fonts.load('500 64px "Bodoni Moda"'), document.fonts.load('500 32px "Jost"')]), new Promise(r => setTimeout(r, 2500))]); } catch {}
  sharedGeometries();
  buildBox();
  // arrival: the box sits in near darkness, then the light comes up
  const v = views(); const far = v.pos.clone().sub(v.target).multiplyScalar(1.18).add(v.target);
  camera.position.copy(far); controls.target.copy(v.target);
  renderer.compile(scene, camera);
  requestAnimationFrame(loop);
  veil.style.opacity = 0;
  tween(2.2, easeOut, k => { renderer.toneMappingExposure = 0.15 + 0.9 * k; });
  flyTo(v.pos, v.target, 2.6);
  hintTimer = setTimeout(() => { hint.style.opacity = 1; }, 2600);
  window.__ecrin = { setOpen, focusCell, cells:() => cells, state, unfocus, renderer, camera, controls };
}
start();
</script>
