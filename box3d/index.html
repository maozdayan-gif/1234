<title>Écrin Base Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Frank+Ruhl+Libre:wght@400&family=Cormorant+SC:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@400;500&family=Bodoni+Moda:opsz,wght@6..96,500&display=swap">
<style>
/* Layout: the box alone on a midnight stage, a name plate top-left, two quiet controls at the bottom. Single dark look by design. */
:root{
  --night:#0d1215; --night-2:#141b1f; --ivory:#ece6d8; --mute:#9aa0a2; --gilt:#b4935a; --rule:rgba(180,147,90,.38);
  --display:"Bellefair","Frank Ruhl Libre","Times New Roman",serif; --serif:"Frank Ruhl Libre","Times New Roman",serif; --sc:"Cormorant SC",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--night);color:var(--ivory)}
body{margin:0;overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(110% 85% at 50% 42%,#222c31 0%,var(--night-2) 50%,var(--night) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.plate{position:fixed;top:calc(env(safe-area-inset-top,0px) + 28px);left:clamp(16px,4vw,48px);right:16px;pointer-events:none;display:flex;flex-direction:column;gap:10px}
.plate h1{margin:0;font:400 clamp(32px,5vw,54px)/1 var(--display);letter-spacing:.08em}
.plate .rule{width:44px;height:1px;background:var(--gilt);opacity:.75}
.plate .sc{font:600 14px var(--sc);color:var(--gilt);letter-spacing:.42em;font-variant:small-caps}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
.dock>*{pointer-events:auto}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px;max-width:100%}
.bar button{pointer-events:auto;font:400 15.5px var(--serif);color:rgba(236,230,216,.85);background:none;border:0;border-bottom:1px solid transparent;padding:6px 1px;cursor:pointer;letter-spacing:.03em}
.bar button:hover{color:var(--ivory);border-bottom-color:var(--gilt)}
.bar button.primary{color:var(--gilt)}
.bar button:focus-visible{outline:1px solid var(--gilt);outline-offset:4px}

/* ---- focused watch: a quiet invitation, not a button bar ---- */
.focus{transform:translateY(8px);opacity:0;transition:opacity .45s,transform .45s;
  display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;background:rgba(13,18,21,.55);border:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100% - 32px)}
.focus.on{opacity:1;transform:none}
@media (max-width:420px){.bar{gap:2px 18px}.bar button{font-size:14.5px}}
.focus .fk{font:600 11px var(--sc);letter-spacing:.3em;color:var(--gilt);font-variant:small-caps;white-space:nowrap}
.focus .fn{font:400 17px var(--display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.focus button{font:400 13px var(--serif);letter-spacing:.06em;color:var(--ivory);background:none;border:0;border-left:1px solid var(--rule);padding:4px 4px 4px 14px;cursor:pointer;white-space:nowrap}
.focus button:hover{color:var(--gilt)}
.dissolve{position:fixed;inset:0;background:radial-gradient(70% 60% at 50% 45%,#1d262b,#0b0f12);opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:30}
.dissolve.on{opacity:1}

/* ---- passport ---- */
.passport{--paper:#f1ece1;--paper-2:#e8e1d2;--ink:#1d1c19;--ink-soft:#6a6358;--hair:rgba(29,28,25,.13);--gilt-d:#8d7547;
  position:fixed;inset:0;z-index:40;overflow-y:auto;overflow-x:hidden;background:var(--paper);color:var(--ink);opacity:0;transition:opacity .7s ease;-webkit-overflow-scrolling:touch}
.passport.on{opacity:1}
.pp-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) clamp(16px,4vw,40px) 14px;
  background:linear-gradient(rgba(11,15,18,.75),rgba(11,15,18,0));color:var(--ivory)}
.pp-top button{font:400 15px var(--serif);color:inherit;background:none;border:0;cursor:pointer;padding:6px 0;letter-spacing:.03em}
.pp-top button:hover{color:var(--gilt)}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{padding:6px 12px;font-size:13px;color:rgba(236,230,216,.7)}
.seg button[aria-pressed="true"]{color:var(--night);background:var(--gilt)}
.pp-hero{position:relative;height:min(66vh,620px);margin-top:calc(-1 * (env(safe-area-inset-top,0px) + 62px));background:radial-gradient(80% 75% at 50% 48%,#25303a 0%,#121a1f 55%,#0b0f12 100%)}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:none}
.hero-views{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:22px}
.hero-views button{font:italic 400 15px "Cormorant Garamond",Georgia,serif;color:rgba(236,230,216,.6);background:none;border:0;border-bottom:1px solid transparent;cursor:pointer;padding:3px 0}
.hero-views button[aria-pressed="true"]{color:var(--ivory);border-bottom-color:var(--gilt)}
.demo-note{margin:0;background:#0b0f12;color:rgba(154,160,162,.8);text-align:center;font:italic 400 14px "Cormorant Garamond",Georgia,serif;padding:0 16px 6px}
.pp-body .sc{font:600 12px var(--sc);letter-spacing:.32em;font-variant:small-caps;text-transform:none}
.hero-meta{background:#0b0f12;color:var(--ivory);text-align:center;padding:26px clamp(16px,4vw,40px) 40px}
.hero-meta .kick{color:var(--gilt);margin:0}
.hero-meta h1{margin:10px 0 0;font:400 clamp(38px,6.5vw,72px)/1.02 var(--display);letter-spacing:.03em;text-wrap:balance}
.hero-meta .variant{margin:12px auto 0;font:italic 400 20px "Cormorant Garamond",Georgia,serif;color:var(--mute);max-width:46ch}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:880px;margin:30px auto 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.strip .r{padding:14px 10px;border-left:1px solid var(--rule)}
.strip .r:first-child{border-left:0}
.strip dt{font:600 11px var(--sc);letter-spacing:.26em;color:var(--gilt);font-variant:small-caps}
.strip dd{margin:6px 0 0;font:400 18px var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.strip .unk{color:var(--mute)}
.ident{background:#0b0f12;color:var(--ivory);text-align:center;padding:0 clamp(16px,4vw,40px) 44px}
.ident p{max-width:52ch;margin:12px auto 0;color:var(--mute);font-size:15px;line-height:1.6}
.ident .sc{color:var(--gilt)}
.pipe{list-style:none;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 0;margin:16px 0 0;padding:0;font:400 15px var(--display);letter-spacing:.06em}
.pipe li{display:flex;align-items:center}
.pipe li+li::before{content:"";width:34px;height:1px;background:var(--rule);margin:0 12px}
.ghost{margin-top:18px;font:400 14px var(--serif);color:inherit;background:none;border:1px solid currentColor;opacity:.55;padding:9px 16px;letter-spacing:.03em}
.sec{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px 56px;max-width:1080px;margin:0 auto;padding:56px clamp(16px,5vw,56px);border-top:1px solid var(--hair)}
.sec:first-of-type{border-top:0}
.sec header .sc{color:var(--gilt-d)}
.sec h2{margin:6px 0 0;font:400 34px/1.05 var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.src{margin:12px 0 0;font:italic 400 15px "Cormorant Garamond",Georgia,serif;color:var(--ink-soft)}
.body{min-width:0}
.specs{margin:0;display:grid}
.specs .r{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--hair)}
.specs dt{font:400 14px var(--serif);color:var(--ink-soft);letter-spacing:.03em}
.specs dd{margin:0;font-size:16px;line-height:1.5;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.unk{color:var(--ink-soft);font-style:italic;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.06em}
.mv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
.mv-fig{margin:0;background:#ebe4d4;border:1px solid var(--hair);padding:18px}
.mv-fig svg{display:block;width:100%;height:auto}
.mv-fig figcaption,.chart figcaption{margin-top:10px;font:italic 400 15px "Cormorant Garamond",Georgia,serif;color:var(--ink-soft);line-height:1.4}
.mv-fig .ln{fill:none;stroke:#2a2722;stroke-width:1.1;opacity:.75}.mv-fig .thin{stroke-width:.6;opacity:.5}.mv-fig .heavy{stroke-width:2}.mv-fig .hair{stroke-width:.5;opacity:.6}
.mv-fig .dash{stroke-dasharray:4 5;opacity:.4}
.mv-fig .br{fill:rgba(141,117,71,.12);stroke:#8d7547;stroke-width:1}
.mv-fig .rotor{fill:rgba(29,28,25,.04);stroke:#2a2722;stroke-width:.8;stroke-dasharray:6 4;opacity:.7}
.mv-fig .jw{fill:#9b2a36}
.mv-fig .lbl path{stroke:#8d7547;stroke-width:.7;fill:none}.mv-fig .lbl text{font:italic 400 15px "Cormorant Garamond",Georgia,serif;fill:#5a5348}
.mv-fig .bal{transform-box:fill-box;transform-origin:center;animation:swing var(--half) ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
.mv-empty{text-align:center}.mv-empty p{font:italic 400 16px "Cormorant Garamond",Georgia,serif;color:var(--ink-soft);margin:6px 0 4px}
.lede{margin:0;font:italic 400 clamp(24px,3vw,30px)/1.3 "Cormorant Garamond",Georgia,serif;max-width:30ch}
.essay{margin-top:22px;columns:2 300px;column-gap:40px}
.essay h3{margin:0 0 6px;font:600 12px var(--sc);letter-spacing:.28em;font-variant:small-caps;color:var(--gilt-d);break-after:avoid}
.essay p{margin:0 0 20px;font-size:16.5px;line-height:1.75;break-inside:avoid}
.notable{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--hair)}
.notable li{padding:11px 0 11px 22px;border-bottom:1px solid var(--hair);position:relative;font-size:15.5px}
.notable li::before{content:"";position:absolute;left:3px;top:19px;width:5px;height:5px;transform:rotate(45deg);background:#b4935a}
.story{margin-top:26px;padding:22px 24px;background:var(--paper-2);border-left:2px solid #b4935a}
.story p{margin:0;font:italic 400 19px/1.5 "Cormorant Garamond",Georgia,serif}
.story .ghost{color:var(--ink)}
.empty{margin:0;font:italic 400 17px "Cormorant Garamond",Georgia,serif;color:var(--ink-soft)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair)}
.tile{background:var(--paper);padding:20px}
.tile .sc{color:var(--gilt-d);font-size:11px}
.tile b{display:block;margin-top:8px;font:400 24px var(--display);color:var(--ink-soft)}
.chart{margin:22px 0 0}.chart svg{display:block;width:100%;height:130px}.chart .ax{stroke:#2a2722;stroke-width:1;opacity:.4}.chart .grid{stroke:#2a2722;stroke-dasharray:3 6;opacity:.18}
.hist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.hist h3{margin:0 0 10px;font:600 12px var(--sc);letter-spacing:.28em;font-variant:small-caps;color:var(--gilt-d)}
.prov{list-style:none;margin:0;padding:0;font-size:15.5px;line-height:1.5}
.prov b{display:block;font:400 13px var(--serif);color:var(--ink-soft);font-weight:400}
#private{background:#141b1f;color:var(--ivory);max-width:none;border-top:0;padding-inline:max(clamp(16px,5vw,56px),calc((100% - 1080px) / 2 + clamp(16px,5vw,56px)))}
#private header .sc{color:var(--gilt)}#private h2{color:var(--ivory)}
#private .specs .r{border-bottom-color:rgba(236,230,216,.12)}#private .specs dt{color:var(--mute)}#private .unk{color:var(--mute)}
.priv-note{margin:0 0 14px;font:italic 400 16px "Cormorant Garamond",Georgia,serif;color:var(--gilt)}
.lock{color:var(--gilt);display:inline-flex}
.colophon{display:flex;justify-content:space-between;gap:12px;max-width:1080px;margin:0 auto;padding:30px clamp(16px,5vw,56px) calc(env(safe-area-inset-bottom,0px) + 40px);font:600 12px var(--sc);letter-spacing:.3em;color:var(--gilt-d);font-variant:small-caps;border-top:3px double var(--hair)}
@media (max-width:760px){
  .sec{grid-template-columns:minmax(0,1fr);padding-block:40px;gap:18px}
  .mv,.hist{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip .r:nth-child(3){border-left:0}.strip .r:nth-child(n+3){border-top:1px solid var(--rule)}
  .specs .r{grid-template-columns:minmax(0,1fr);gap:2px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .focus .fk{display:none}
}
@media (prefers-reduced-motion:reduce){.mv-fig .bal{animation:none}.passport,.dissolve,.focus{transition:none}}

/* ---- add watch ---- */
.addw{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,9,11,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .35s}
.addw.on{opacity:1}
.addw-panel{position:relative;width:min(560px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;background:rgba(14,19,22,.96);border:1px solid var(--rule);color:var(--ivory);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.addw-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--rule)}
.addw-head h2{margin:0;font:400 22px var(--display);letter-spacing:.04em;text-align:center}
.addw-head button{background:none;border:0;color:var(--mute);font:400 14px var(--serif);cursor:pointer;padding:6px 2px;justify-self:start}
.addw-head button:last-child{justify-self:end;font-size:15px}
.addw-head button:hover{color:var(--ivory)}
.addw-body{overflow-y:auto;padding:22px 22px 26px;display:flex;flex-direction:column;gap:16px}
.addw .lead{margin:0;color:rgba(236,230,216,.82);font-size:15.5px;line-height:1.55}
.addw .hint-s{margin:0;color:var(--mute);font-size:13.5px;line-height:1.5}
.ways{display:grid;gap:10px}
.way{display:grid;gap:4px;text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--rule);color:var(--ivory);padding:16px 18px;cursor:pointer;transition:border-color .2s,background .2s}
.way:hover,.way:focus-visible{border-color:var(--gilt);background:rgba(180,147,90,.06)}
.wn{font:400 20px var(--display);letter-spacing:.03em}
.wd{font-size:14px;color:var(--mute);line-height:1.45}
.drop{display:grid;gap:6px;place-items:center;text-align:center;padding:26px 16px;border:1px dashed var(--rule);cursor:pointer}
.drop:hover{border-color:var(--gilt)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.dz{font:400 20px var(--display);color:var(--gilt)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs:empty{display:none}
.thumbs img{width:64px;height:64px;object-fit:cover;border:1px solid var(--rule)}
.sim{border:1px dashed rgba(154,160,162,.35);padding:10px 14px 12px;margin:0;display:grid;gap:6px;font-size:13.5px;color:var(--mute)}
.sim legend{font:600 11px var(--sc);letter-spacing:.24em;font-variant:small-caps;color:var(--mute);padding:0 6px}
.sim label{display:flex;gap:8px;align-items:center;cursor:pointer}
.sim input{accent-color:#b4935a}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.acts.col{flex-direction:column;align-items:stretch}
.addw .pri{font:400 15px var(--serif);letter-spacing:.03em;background:var(--gilt);color:#15120c;border:1px solid var(--gilt);padding:11px 18px;cursor:pointer}
.addw .pri:disabled{opacity:.4;cursor:default}
.addw .sec{font:400 15px var(--serif);letter-spacing:.03em;background:none;color:var(--ivory);border:1px solid var(--rule);padding:10px 16px;cursor:pointer;text-align:center}
.addw .sec:hover{border-color:var(--gilt)}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font-size:13px;color:var(--mute);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fld input,.fld select{width:100%;box-sizing:border-box;min-height:44px;background:transparent;border:0;border-bottom:1px solid rgba(236,230,216,.25);color:var(--ivory);font:400 17px var(--serif);padding:6px 0;border-radius:0}
.fld select option{background:#141b1f}
.fld input:focus,.fld select:focus{outline:none;border-bottom-color:var(--gilt)}
.fld input::placeholder{color:rgba(154,160,162,.55);font-style:italic}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#dt-form{display:grid;gap:16px}
.prov-chip{font:600 10px var(--sc);letter-spacing:.18em;font-variant:small-caps;padding:2px 7px;border:1px solid var(--rule);color:var(--gilt)}
.prov-manual{color:var(--mute);border-color:rgba(154,160,162,.35)}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.srcs li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute);min-width:0}
.srcs img{width:30px;height:30px;object-fit:cover}
.srcs .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:rgba(236,230,216,.8)}
.srcs em{font-style:italic;white-space:nowrap}
.srcs .lk{color:var(--gilt)}
.ladder{display:grid;gap:2px}
.rung{display:grid;grid-template-columns:14px 110px minmax(0,1fr);align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(180,147,90,.15);color:var(--mute);transition:color .3s}
.rung .dot{width:8px;height:8px;transform:rotate(45deg);border:1px solid currentColor;transition:background .3s}
.rung em{font-style:normal;color:var(--ivory);overflow-wrap:anywhere}
.rung.ok{color:var(--ivory)}.rung.ok .dot{background:var(--gilt);border-color:var(--gilt)}
.rung.maybe{color:var(--ivory)}.rung.maybe .dot{border-color:var(--gilt)}.rung.maybe em{color:var(--mute);font-style:italic}
.rung.no em{color:var(--mute);font-style:italic}
.ladder.small .rung{padding:6px 0;font-size:14px}
.verdict{text-align:center;padding:6px 0 4px}
.verdict .kick{margin:0;font:600 12px var(--sc);letter-spacing:.3em;font-variant:small-caps;color:var(--gilt)}
.vb{margin:10px 0 0;font:400 clamp(26px,5vw,32px)/1.1 var(--display);letter-spacing:.03em}
.vr{margin:8px 0 0;font:400 17px var(--serif);color:rgba(236,230,216,.85);letter-spacing:.04em}
.vr.unk{font-style:italic;color:var(--mute)}
.cands{display:grid;gap:8px}
.cand{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;text-align:left;background:none;border:1px solid var(--rule);color:var(--ivory);padding:12px 14px;cursor:pointer}
.cand:hover{border-color:var(--gilt)}
.cb{font:600 11px var(--sc);letter-spacing:.24em;font-variant:small-caps;color:var(--gilt)}
.cm{font:400 19px var(--display);letter-spacing:.03em}
.cr{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.meter{height:2px;background:rgba(180,147,90,.18);margin-top:8px}.meter i{display:block;height:100%;background:var(--gilt)}
.cand.none{border-style:dashed}
.results{display:grid;gap:8px}
.slots{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px;padding:10px;border:1px solid var(--rule);background:rgba(221,208,184,.06)}
.cell{aspect-ratio:1.05;border:1px solid var(--rule);background:none;color:var(--mute);font:400 15px var(--display);cursor:pointer}
.cell.full{background:rgba(236,230,216,.08);border-color:transparent;cursor:default}
.cell.sel{border-color:var(--gilt);color:var(--ivory);background:rgba(180,147,90,.14)}
.addw .err{margin:0;color:#e2a08c;font-size:14px}
.addw-toast{position:absolute;left:16px;right:16px;bottom:16px;margin:0;padding:10px 14px;background:var(--ivory);color:#15120c;font-size:14px}
@media (max-width:560px){.addw{padding:0}.addw-panel{width:100%;height:100%;max-height:none;border:0}.two{grid-template-columns:minmax(0,1fr)}.rung{grid-template-columns:14px 92px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.addw{transition:none}}

.thumbs .th{position:relative;display:inline-block}
.thumbs .th button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);background:#141b1f;color:var(--ivory);font-size:11px;cursor:pointer;line-height:1}
.ladder.thinking .rung .dot{animation:pulse 1.4s ease-in-out infinite}

/* =====================================================================
   PHOTO-WRAPPED WATCH (experiment, option B)
   The collector's own straight-on photo is cut out from its plain background and laid onto the cushion the way
   a real watch sits: the case flat on top, the bracelet running taut from the lugs and then following the roll.
   Only the photo's pixels are used; nothing about the watch is drawn or invented.
   If no photo can be cut out cleanly, a discreet engraved tag is shown instead (temporary fallback).
   ===================================================================== */
const WRAP = { caseWidthCm:3.7, lift:0.55, gap:0.1 };   // assumed case width until the reference gives the real size
const cutoutCache = new Map();

function loadImage(src){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("load")); im.src = src; });
}
// 1. Cut the watch out of a photo whose background is plain (product shots, a sheet of paper, a plain table).
//    Returns null when the photo isn't suitable, so we never show a badly cut watch.
function cutOut(img){
  const max = 1100, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.round(img.naturalWidth * s), H = Math.round(img.naturalHeight * s);
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d", { willReadFrequently:true });
  g.drawImage(img, 0, 0, W, H);
  const im = g.getImageData(0, 0, W, H), px = im.data;
  // background colour = median of the border; the border must be nearly uniform
  const border = [];
  for (let x = 0; x < W; x += 2){ border.push(x, x + (H - 1) * W); }
  for (let y = 0; y < H; y += 2){ border.push(y * W, y * W + W - 1); }
  const med = k => { const v = border.map(i => px[i * 4 + k]).sort((a, b) => a - b); return v[v.length >> 1]; };
  const bg = [med(0), med(1), med(2)];
  const dist = i => { const dr = px[i * 4] - bg[0], dg = px[i * 4 + 1] - bg[1], db = px[i * 4 + 2] - bg[2]; return Math.sqrt(dr * dr + dg * dg + db * db); };
  const borderDist = border.map(dist), plain = borderDist.filter(d => d < 26).length / borderDist.length;
  if (plain < 0.82) return null;                                   // busy background: not suitable for a clean cut-out
  // flood the background in from the edges
  const T = 30, bgMask = new Uint8Array(W * H), stack = [];
  for (const i of border) if (dist(i) < T){ bgMask[i] = 1; stack.push(i); }
  while (stack.length){
    const i = stack.pop(), x = i % W, y = (i / W) | 0;
    for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1])
      if (j >= 0 && !bgMask[j] && dist(j) < T){ bgMask[j] = 1; stack.push(j); }
  }

    while (q.length){ const k = q.pop(); n++; const x = k % W, y = (k / W) | 0;
      for (const j of [x > 0 ? k - 1 : -1, x < W - 1 ? k + 1 : -1, y > 0 ? k - W : -1, y < H - 1 ? k + W : -1]) if (j >= 0 && !bgMask[j] && lab[j] < 0){ lab[j] = i; q.push(j); } }
    total += n; if (n > bestN){ bestN = n; best = i; }
  }
  const frac = bestN / (W * H);
  if (best < 0 || frac < 0.03 || frac > 0.7 || bestN / total < 0.8) return null;

  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let i = 0; i < W * H; i++) if (lab[i] === best){ const x = i % W, y = (i / W) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  if (bh < bw * 1.3) return null;                                  // needs a straight-on photo with the bracelet running up and down
  if (x0 <= 1 || x1 >= W - 2) return null;                         // cut off at the sides
  // soft alpha: object pixels opaque, a feathered edge from the colour distance
  const out = document.createElement("canvas"); out.width = bw; out.height = bh; const og = out.getContext("2d");
  const od = og.createImageData(bw, bh), o = od.data, widths = new Float32Array(bh);
  for (let y = 0; y < bh; y++){
    let l = -1, r = -1;
    for (let x = 0; x < bw; x++){
      const i = (y + y0) * W + (x + x0), k = (y * bw + x) * 4;
      o[k] = px[i * 4]; o[k + 1] = px[i * 4 + 1]; o[k + 2] = px[i * 4 + 2];
      let a = lab[i] === best ? 255 : 0;
      if (a && (bgMask[i - 1] || bgMask[i + 1] || bgMask[i - W] || bgMask[i + W])) a = Math.min(255, Math.max(0, (dist(i) - T) / (T * 1.6) * 255));   // feathered edge, background tint dropped
      o[k + 3] = a; if (a > 128){ if (l < 0) l = x; r = x; }

  }
  og.putImageData(od, 0, 0);

  let maxW = 0; for (let y = Math.floor(bh * 0.2); y < Math.ceil(bh * 0.8); y++) maxW = Math.max(maxW, widths[y]);
  let c0 = -1, c1 = -1, bestRun = 0;

    const wide = y < bh && widths[y] >= maxW * 0.9;

    if (!wide && start >= 0){ const mid = (start + y) / 2, len = y - start, score = len - Math.abs(mid - bh / 2) * 0.5; if (score > bestRun){ bestRun = score; c0 = start; c1 = y; } start = -1; }
  }

  return { canvas:out, w:bw, h:bh, caseCenter:(c0 + c1) / 2, caseLen, caseWidth:maxW };
}

// 2. The profile a real watch takes on a roll cushion, in the y–z plane: the case flat on top, the bracelet running
//    from the case end down to where it meets the roll, then following the roll. Returns s → (z, y) for s in cm.
function wrapProfile(halfCase, R, lift){
  const top = R + lift, P = [halfCase, top], d = Math.hypot(P[0], P[1]);
  const phiP = Math.atan2(P[0], P[1]), phiT = phiP + Math.acos(Math.min(1, R / d));   // tangent point on the roll
  const T = [R * Math.sin(phiT), R * Math.cos(phiT)], seg = Math.hypot(T[0] - P[0], T[1] - P[1]);
  return s => {
    const a = Math.abs(s), sign = Math.sign(s) || 1; let z, y;
    if (a <= halfCase){ z = a; y = top; }
    else if (a <= halfCase + seg){ const k = (a - halfCase) / seg; z = P[0] + (T[0] - P[0]) * k; y = P[1] + (T[1] - P[1]) * k; }
    else { const phi = Math.min(phiT + (a - halfCase - seg) / R, Math.PI * 0.92); z = R * Math.sin(phi); y = R * Math.cos(phi); }
    return [z * sign, y];

}

// 3. Build the wrapped mesh from the cut-out.
function buildWrapped(cut){

  const geo = new THREE.PlaneGeometry(1, 1, 24, 220), pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++){

    const rowFromTop = (1 - v) * cut.h, s = (rowFromTop - cut.caseCenter) * cmPerPx;   // + toward 6 o'clock
    const [z, y] = prof(s);

}

// 4. Temporary fallback: an engraved tag resting against the front of the cushion.
function tagCanvas(e){

function buildTag(e){

// The stand-in for an added watch: try each photo for a clean cut-out; otherwise the tag.
function buildStandIn(e){
  const grp = new THREE.Group(), worn = new THREE.Group(); worn.rotation.x = WATCH_TILT; grp.add(worn);
  grp.userData.kind = "pending";
  (async () => {
    for (const p of e.photos || []){
      for (const src of [p.assetId ? "/_blob/" + p.assetId : null, p.thumb].filter(Boolean)){
        try {
          const key = src.length > 200 ? src.slice(-200) : src;
          let cut = cutoutCache.get(key);

/* ============ camera ============ */
function fitDistance(width, height){
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  return Math.max(width / 2 / Math.tan(hf), height / 2 / Math.tan(vf));
}
function views(){
  const { OW, OD } = box.userData, open = state.open, portrait = camera.aspect < 0.8;
  const target = new THREE.Vector3(0, open ? (BASE_H + OD * 0.85) * 0.42 : BASE_H * 0.5, open ? -OD * 0.18 : 0);
  const d = fitDistance(OW * (portrait ? 1.5 : 1.6), (open ? OD * 1.45 + BASE_H : OD * 0.8 + BASE_H) * (portrait ? 1.15 : 1.55));   // room for the dock below

}
function frameView(animate = true, dur = 1.6){

  if (!animate){ camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); requestRender(); return; }

}
function flyTo(pos, target, dur){

}

/* ============ animation ============ */
const tweens = [];
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, ease, fn){ if (reduceMotion) dur = 0.01; tweens.push({ t0:performance.now(), dur:dur * 1000, ease, fn }); requestRender(); }
// a weighted lid: slow start, smooth travel, a soft settle against the stay
const lidEase = t => t < 0.8 ? easeInOut(t / 0.8) * 1.025 : 1.025 - 0.025 * easeOut((t - 0.8) / 0.2);
const lidBtn = document.getElementById("b-lid");
function setOpen(open){
  if (state.focus) unfocus(true);
  state.open = open; lidBtn.textContent = open ? "סגירת המכסה" : "פתיחת המכסה";
  const a0 = lid.rotation.x, a1 = open ? OPEN_ANGLE : 0;

}
/* ============ watch focus: presented to the collector ============ */
const focusPill = document.getElementById("focus");
function titleOf(e){

  return d.brand ? { kicker:d.brand, name:d.model || d.collection || "Watch" } : { kicker:"Awaiting identification", name:d.label || "Watch" };
}
function focusCell(cell){

}
function unfocus(quiet){

  focusPill.classList.remove("on"); setTimeout(() => { if (!state.focus) focusPill.hidden = true; }, 400);

}
document.getElementById("focus-open").addEventListener("click", () => state.focus && openPassport(state.focus));

/* ============ passport: transition ============ */
const passport = document.getElementById("passport"), dissolve = document.getElementById("dissolve");
let passportOpen = false, passportEntry = null, viewer = "owner", camBeforePassport = null;
function openPassport(cell){
  const entry = cell.userData.entry; if (!entry) return;
  passportEntry = entry; camBeforePassport = { pos:camera.position.clone(), target:controls.target.clone() };
  focusPill.classList.remove("on");

  const n = new THREE.Vector3(0, 1, 0).applyQuaternion(head.getWorldQuaternion(new THREE.Quaternion()));

  if (camBeforePassport) flyTo(camBeforePassport.pos, camBeforePassport.target, 0.9);

/* ============ passport: hero (the same watch, in its own small stage) ============ */
let hero = null;
function ensureHero(){
  if (hero) return hero;
  const canvasEl = document.getElementById("hero-canvas");
  const r = new THREE.WebGLRenderer({ canvas:canvasEl, antialias:true, alpha:true });
  r.setPixelRatio(Math.min(devicePixelRatio, small ? 1.75 : 2)); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;

  const k = new THREE.DirectionalLight(0xfff0dc, 1.5); k.position.set(18, 40, 30); sc.add(k);
  const rm = new THREE.DirectionalLight(0xc8d6ff, 0.6); rm.position.set(-30, 10, -30); sc.add(rm);

const HERO_VIEWS = { dial:[16, 0], three:[52, 35], profile:[84, 90] };
function heroView(name, dur = 1.2){
  const h = hero, [pol, az] = HERO_VIEWS[name], t = new THREE.Vector3(0, 0.8, 0);
  const s0 = new THREE.Spherical().setFromVector3(h.cam.position.clone().sub(h.ctl.target)), s1 = new THREE.Spherical(h.cam.aspect < 0.9 ? 27 : 18, THREE.MathUtils.degToRad(pol), THREE.MathUtils.degToRad(az));
  h.ctl.autoRotate = false;
  tween(dur, easeInOut, k => { h.ctl.target.lerp(t, k); h.cam.position.setFromSpherical(new THREE.Spherical(THREE.MathUtils.lerp(s0.radius, s1.radius, k), THREE.MathUtils.lerp(s0.phi, s1.phi, k), THREE.MathUtils.lerp(s0.theta, s1.theta, k))).add(h.ctl.target); });
  document.querySelectorAll("[data-hero]").forEach(b => b.setAttribute("aria-pressed", b.dataset.hero === name));
}
function heroShow(entry, fromBox){
  const hp = document.getElementById("hero-photos"), cv = document.getElementById("hero-canvas"), hv = document.querySelector(".hero-views");
  if (entry.visual){
    // no accurate 3D model: the collector's own photographs are the hero
    cv.hidden = true; hv.hidden = true; hp.hidden = false;
    hp.innerHTML = (entry.photos || []).length ? entry.photos.map((p, k) => `<img src="${photoSrc(p)}" alt="Photograph ${k + 1} of the watch" data-thumb="${p.thumb}">`).join("")
      : `<div class="hp-empty"><span>${esc(entry.described?.brand || "")}</span><b>${esc(entry.described?.model || entry.described?.collection || "Watch")}</b><em>No photograph yet</em></div>`;
    hp.querySelectorAll("img").forEach(im => im.addEventListener("error", () => { if (im.dataset.thumb && im.src !== im.dataset.thumb) im.src = im.dataset.thumb; }, { once:true }));
    if (hero && hero.set) liveWatches.delete(hero.set);
    if (hero) hero.paused = true;
    return;
  }
  cv.hidden = false; hv.hidden = false; hp.hidden = true;
  const h = ensureHero(); h.size(); h.paused = false;
  if (h.obj){ h.sc.remove(h.obj); liveWatches.delete(h.set); }
  // the watch as if on a wrist: its band closed in a loop, the head on top, presented dial-up
  const g = new THREE.Group(); g.add(buildBand(entry.look));
  const head = buildWatch(entry.look); head.position.y = CUSH_R + STRAP_OFF + STRAP_T * 0.5; g.add(head);
  g.position.y = -(CUSH_R + STRAP_OFF) + 0.4; h.sc.add(g); h.obj = g; h.set = head.userData.hands; liveWatches.add(h.set);
  h.ctl.target.set(0, 0.8, 0);
  // continuity: start close on the dial (where the box camera ended) and ease back to the presentation view
  h.cam.position.setFromSpherical(new THREE.Spherical(fromBox ? 7.5 : 18, THREE.MathUtils.degToRad(10), 0)).add(h.ctl.target);
  h.ctl.autoRotate = false; heroView("three", fromBox ? 1.8 : 0.01);
  setTimeout(() => { if (!reduceMotion) h.ctl.autoRotate = true; }, 2200);
}
function heroHide(){ if (hero && hero.set) liveWatches.delete(hero.set); }

/* =====================================================================
   ADD WATCH — three ways in (photo, link, manual), one Watch record out.
   Every source contributes fields to the same draft; each field keeps where it came from
   and how sure we are. Identification helps; it never blocks: any state can continue to save.
   The identifier below is SIMULATED for this prototype; the real engine will return the same shapes.
   ===================================================================== */
const LEVELS = ["brand", "collection", "model", "reference", "variant"];
const LEVEL_LABEL = { brand:"Brand", collection:"Collection", model:"Model", reference:"Reference", variant:"Variant", year:"Year" };
// Identity-only reference index for search and candidates. Specs live in CATALOGUE only where known.
const REF_INDEX = [
  { brand:"Rolex", collection:"Submariner", model:"Submariner", reference:"124060", variant:"No Date · black dial", catalogueId:"rolex-submariner-124060" },
  { brand:"Rolex", collection:"Cosmograph Daytona", model:"Cosmograph Daytona", reference:"116500LN", variant:"White dial", catalogueId:"rolex-daytona-116500ln" },
  { brand:"Rolex", collection:"GMT-Master II", model:"GMT-Master II", reference:"126710BLRO", variant:"Blue and red bezel" },
  { brand:"Omega", collection:"Speedmaster", model:"Speedmaster Professional Moonwatch", reference:"310.30.42.50.01.001", variant:"Hesalite crystal" },
  { brand:"Omega", collection:"Speedmaster", model:"Speedmaster Professional Moonwatch", reference:"311.30.42.30.01.005", variant:"Hesalite crystal, calibre 1861" },
  { brand:"Omega", collection:"Seamaster", model:"Seamaster Diver 300M", reference:"210.30.42.20.01.001", variant:"Black dial, steel bracelet" },
  { brand:"Tudor", collection:"Black Bay", model:"Black Bay Chrono", reference:"79360N", variant:"" },
  { brand:"Patek Philippe", collection:"Aquanaut", model:"Aquanaut", reference:"5167A-001", variant:"Steel, black dial" },
  { brand:"Patek Philippe", collection:"Nautilus", model:"Nautilus", reference:"5711/1A-010", variant:"Blue dial" },
  { brand:"Audemars Piguet", collection:"Royal Oak", model:"Royal Oak Jumbo Extra-Thin", reference:"15202ST.OO.1240ST.01", variant:"Blue dial" },
  { brand:"Grand Seiko", collection:"Heritage", model:"Snowflake", reference:"SBGA211", variant:"Spring Drive" }
];
const CONFIDENT = 0.8; // below this a level is never asserted, only offered

/* ---------- the draft record ---------- */
let draft = null, addStep = "method", addHistory = [], addSlot = null, addBusy = false, addError = null;
function newDraft(slot){
  return { id:"w-" + Date.now().toString(36), slot, catalogueId:null,
    identification:{ status:"unidentified", method:null, candidates:[], chosen:null, confirmed:false },
    photos:[], ai:null,
    fields:{},            // field -> { value, source, confidence }
    sources:[],           // { type:"photo"|"link"|"manual", ... }
    owned:{ status:"owned", year:null, acquisition:null, startedOn:null, condition:null, box:null, papers:null, story:"", service:[], provenance:[], documents:[] },
    private:{ serial:null, purchaseDate:null, price:null, source:null, notes:"", documents:[] } };
}
// A source only fills a field if it is empty or the new value is more trustworthy. Manual input always wins.
const RANK = { manual:3, link:2, photo:1, search:3 };
function contribute(source, values, confidence = {}){
  for (const [k, v] of Object.entries(values)){
    if (v === undefined || v === null || v === "") continue;
    const cur = draft.fields[k], conf = confidence[k] ?? 1;
    if (source !== "manual" && source !== "search" && conf < CONFIDENT) continue;
    if (!cur || RANK[source] >= RANK[cur.source]) draft.fields[k] = { value:v, source, confidence:conf };
  }
}
const F = k => draft.fields[k]?.value ?? "";

const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
/* ---------- real identification (Claude vision, through the Artifact's `sample` capability) ----------
   The page keeps the session: every run sends all photos (up to the per-call limit) plus what earlier
   runs found, then merges level by level, so new photos refine instead of restarting.
   AI answers are labelled as AI and never as verified; only the page's own index lookup marks a match. */
const CONF = { high:0.9, medium:0.6, low:0.3, none:0 };
const CONF_WORD = c => c >= 0.8 ? "high" : c >= 0.5 ? "medium" : c > 0 ? "low" : "none";
const CLAUDE = { sample:null, assets:null, db:null, user:null, uid:null, ready:null };
CLAUDE.ready = (async () => {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  const [s, a, d, u] = await Promise.all(["sample", "assets", "db", "user"].map(n => claude.use(n).catch(() => null)));
  Object.assign(CLAUDE, { sample:s, assets:a, db:d, user:u });
  try { CLAUDE.uid = u ? await u.id() : null; } catch {}
})();
const normRef = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
function indexMatch(ref){ const n = normRef(ref); return n.length >= 4 ? REF_INDEX.find(r => normRef(r.reference) === n) || null : null; }
function idPrompt(nPhotos, prev, omitted){
  const index = REF_INDEX.map(r => `${r.brand} | ${r.model} | ${r.reference}${r.variant ? " | " + r.variant : ""}`).join("\n");
  return `You are helping a watch collector catalogue a watch they own. Attached ${nPhotos === 1 ? "is 1 photo" : `are ${nPhotos} photos`} of ONE wristwatch.
Identify it on five levels, each judged independently: brand, collection, model, reference, variant.

Look closely at: the dial (layout, indices, hands, printed text, colour, finish), the bezel (type, scale, insert), the case (shape, lugs, finish), crown and crown guards, pushers, the bracelet or strap (link style, end links), the clasp (type, engravings), the caseback (engravings, numbers, display back) and complications (date, chronograph, GMT, moonphase, small seconds).

Rules. Accuracy matters more than completeness.
- Base every answer only on what is visible in these photos. Never guess. Never invent a reference number.
- confidence: "high" = clear visual evidence (a name printed on the dial, a reference engraved, or a combination of features that only one answer has); "medium" = likely, but another answer remains plausible; "low" = a weak hint; "none" = cannot tell, and then value is null.
- reference: give a value only if it is legible in a photo, or if the visible features match exactly one reference. Otherwise value null. If 2 or 3 references are plausible, list them in "candidates" (strongest first) and say in their evidence what would tell them apart.
- variant: the dial colour, material, bezel and bracelet configuration as seen.
- evidence: one short phrase per level naming the visual cue (at most 18 words).
- observations.visibleText: every piece of text you can read, exactly as printed, including partial words.
- If the photos do not show a wristwatch, set isWatch to false.
- photoAdvice: one sentence naming the single extra photo that would most help pin down the reference (for example the caseback, the clasp or the side of the case), or "" if nothing would help.
${prev ? `\nEarlier photos in this session gave these findings: ${JSON.stringify(prev)}${omitted ? ` (${omitted} earlier photo(s) are not attached this time)` : ""}. Use the photos to confirm, refine or correct them. Keep earlier findings that the photos do not contradict.\n` : ""}
Écrin's reference index, small and incomplete, for orientation only (a watch may well not be in it):
${index}

Reply with JSON only, in exactly this shape:
{"isWatch":true,"levels":{"brand":{"value":null,"confidence":"none","evidence":""},"collection":{"value":null,"confidence":"none","evidence":""},"model":{"value":null,"confidence":"none","evidence":""},"reference":{"value":null,"confidence":"none","evidence":""},"variant":{"value":null,"confidence":"none","evidence":""}},"candidates":[],"observations":{"dial":"","bezel":"","case":"","crown":"","bracelet":"","clasp":"","caseback":"","complications":"","visibleText":[]},"photoAdvice":""}
Each candidate: {"brand":"","collection":"","model":"","reference":"","variant":"","confidence":"medium","evidence":""}`;
}
const str = (x, n = 240) => typeof x === "string" ? x.trim().slice(0, n) : "";
function normalizeAI(r){
  const levels = {};
  for (const l of LEVELS){
    const x = r && r.levels && r.levels[l] || {}, v = str(x.value, 120), c = v ? (CONF[x.confidence] ?? 0) : 0;
    levels[l] = { value:c > 0 ? v : null, conf:c, evidence:str(x.evidence, 200) };
  }
  const candidates = (Array.isArray(r && r.candidates) ? r.candidates : []).filter(c => c && str(c.reference)).slice(0, 3).map(c => ({
    brand:str(c.brand, 80) || levels.brand.value, collection:str(c.collection, 80) || levels.collection.value, model:str(c.model, 120) || levels.model.value,
    reference:str(c.reference, 60), variant:str(c.variant, 120), conf:CONF[c.confidence] ?? 0.3, evidence:str(c.evidence, 200) }));
  const o = r && r.observations || {};
  const observations = Object.fromEntries(["dial", "bezel", "case", "crown", "bracelet", "clasp", "caseback", "complications"].map(k => [k, str(o[k], 300)]).filter(([, v]) => v));
  const visibleText = Array.isArray(o.visibleText) ? o.visibleText.map(t => str(t, 80)).filter(Boolean).slice(0, 24) : [];
  return { isWatch:!(r && r.isWatch === false), levels, candidates, observations, visibleText, advice:str(r && r.photoAdvice, 200) };
}
// Combine with the previous run: per level, keep whichever answer is better supported; a new answer with at least
// the same confidence replaces the old one.
function mergeAI(prev, next){
  if (!prev) return next;
  const levels = {};
  for (const l of LEVELS) levels[l] = next.levels[l].conf >= prev.levels[l].conf ? next.levels[l] : prev.levels[l];
  return { ...next, isWatch:next.isWatch || prev.isWatch, levels, candidates:next.candidates.length || levels.reference.conf >= CONFIDENT ? next.candidates : prev.candidates,
    observations:{ ...prev.observations, ...next.observations }, visibleText:[...new Set([...prev.visibleText, ...next.visibleText])].slice(0, 30) };
}
class IdError extends Error { constructor(code, msg){ super(msg); this.code = code; } }
let idAbort = null, idTimedOut = false;
const idDiag = { checked:false };
// What this view actually supports, as reported by the runtime. Shown under "Technical details".
async function checkVision(){
  await CLAUDE.ready;
  const d = { checked:true, runtime:!!(window.claude && typeof window.claude.use === "function"), sample:!!CLAUDE.sample, limits:null, limitsError:null, images:null, tools:null,
    agent:navigator.userAgent, framed:window.top !== window.self, at:new Date().toISOString() };
  if (CLAUDE.sample){
    try { const caps = await CLAUDE.sample.limits(); d.limits = caps ? Object.keys(caps).join(", ") || "(empty)" : "(none)"; d.images = caps && caps.images || null; d.tools = caps && caps.tools || null; }
    catch (e) { d.limitsError = (e && (e.code || e.message)) || String(e); }
  }
  Object.assign(idDiag, d); return d;
}
function diagText(){
  const d = idDiag; if (!d.checked) return "Not checked yet.";
  return [`Claude runtime in this page: ${d.runtime ? "yes" : "no"}`, `Ask-Claude capability (sample): ${d.sample ? "available" : "not available"}`,
    `limits(): ${d.limitsError ? "failed (" + d.limitsError + ")" : d.limits ?? "not called"}`,
    `Image support reported: ${d.images ? `yes, up to ${d.images.maxCount} per request (${(d.images.mediaTypes || []).join(", ")})` : "no"}`,
    `Tool support reported: ${d.tools ? "yes" : "no"}`, `Framed in a viewer: ${d.framed ? "yes" : "no"}`, `Browser: ${d.agent}`, `Checked: ${d.at}`].join("\n");
}
async function identifyPhotos(onStatus){
  const dg = await checkVision();
  if (!dg.runtime) throw new IdError("unavailable", "");
  if (!dg.sample) throw new IdError("sample_unavailable", "");
  if (dg.limitsError) throw new IdError("limits_failed", dg.limitsError);
  if (!dg.images) throw new IdError("images_unavailable", "");
  const caps = { images:dg.images };
  const photos = draft.photos, max = Math.max(1, caps.images.maxCount || 1);
  const send = photos.slice(-max), omitted = photos.length - send.length;
  const prev = draft.ai ? Object.fromEntries(LEVELS.map(l => [l, { value:draft.ai.levels[l].value, confidence:CONF_WORD(draft.ai.levels[l].conf) }])) : null;
  idAbort = new AbortController(); idTimedOut = false;
  const timer = setTimeout(() => { idTimedOut = true; idAbort.abort(); }, 180000);
  let started = false;
  try {
    const raw = await CLAUDE.sample.json(idPrompt(send.length, prev, omitted), {
      images:send.map(p => p.blob), modelTier:"complex", signal:idAbort.signal,
      onText:() => { if (!started){ started = true; onStatus("writing"); } } });
    return normalizeAI(raw);
  } catch (e) {
    if (e instanceof IdError) throw e;
    const code = idTimedOut ? "timeout" : (e && e.code) || "failed";
    throw new IdError(code, e && e.message || "");
  } finally { clearTimeout(timer); idAbort = null; }
}

function wireDiagCopy(){
  const b = document.getElementById("diag-copy"); if (!b) return;
  b.addEventListener("click", () => { const t = diagText();
    try { navigator.clipboard.writeText(t).then(() => b.textContent = "Copied", () => selectDiag()); } catch { selectDiag(); } });
}
function selectDiag(){ const pre = document.getElementById("diag-text"); if (!pre) return; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

const BRAND_DOMAINS = [["rolex", "Rolex"], ["tudorwatch", "Tudor"], ["omegawatches", "Omega"], ["patek", "Patek Philippe"], ["audemarspiguet", "Audemars Piguet"], ["grand-seiko", "Grand Seiko"], ["grandseiko", "Grand Seiko"],
  ["seikowatches", "Seiko"], ["cartier", "Cartier"], ["iwc.com", "IWC Schaffhausen"], ["jaeger-lecoultre", "Jaeger-LeCoultre"], ["vacheron-constantin", "Vacheron Constantin"], ["panerai", "Panerai"], ["breitling", "Breitling"],
  ["tagheuer", "TAG Heuer"], ["longines", "Longines"], ["zenith-watches", "Zenith"], ["blancpain", "Blancpain"], ["breguet", "Breguet"], ["hublot", "Hublot"], ["chopard", "Chopard"], ["alange-soehne", "A. Lange & Söhne"], ["nomos-glashuette", "Nomos Glashütte"]];
function readLink(url){
  let u; try { u = new URL(url); } catch { return { status:"failed", fields:{} }; }
  const host = u.hostname.toLowerCase(), path = normRef(decodeURIComponent(u.pathname + " " + u.search));
  const ref = REF_INDEX.find(r => normRef(r.reference).length >= 5 && path.includes(normRef(r.reference)));
  if (ref) return { status:"parsed", fields:{ brand:ref.brand, collection:ref.collection, model:ref.model, reference:ref.reference, variant:ref.variant }, catalogueId:ref.catalogueId || null };
  const b = BRAND_DOMAINS.find(([d]) => host.includes(d));
  return b ? { status:"partial", fields:{ brand:b[1] } } : { status:"failed", fields:{} };
}

const WIRE = {
  method(){ wireGo(); },
  photo(){
    wireGo();
    addBody.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { const k = +b.dataset.rm; const p = draft.photos.splice(k, 1)[0]; draft.sources = draft.sources.filter(x => x.photo !== p); drawAdd(); }));
    document.getElementById("ph-in").addEventListener("change", async e => {
      const note = document.getElementById("ph-note"); let bad = 0;
      for (const file of [...e.target.files].slice(0, 12 - draft.photos.length)){
        try { const p = await preparePhoto(file); draft.photos.push(p); draft.sources.push({ type:"photo", thumb:p.thumb, photo:p, at:new Date().toISOString() }); } catch { bad++; }
      }
      drawAdd();
      if (bad) document.getElementById("ph-note").textContent = bad === 1 ? "One photo couldn't be opened. HEIC photos may need converting to JPEG on this device." : `${bad} photos couldn't be opened. HEIC photos may need converting to JPEG on this device.`;

    wireDiagCopy();
    checkVision().then(d => { const a = document.getElementById("ph-avail"), t = document.getElementById("diag-text"); if (!a) return;
      a.textContent = d.images ? "Photo analysis is available in this view" : "Photo analysis isn't available in this view"; a.classList.toggle("bad", !d.images); t.textContent = diagText(); });
  },
  link(){
    wireGo();
    const go = () => { const url = document.getElementById("ln-in").value.trim(); if (!/^https?:\/\/\S+\.\S+/i.test(url)){ document.getElementById("ln-in").focus(); document.getElementById("ln-in").setCustomValidity("Paste a full address starting with https://"); document.getElementById("ln-in").reportValidity(); return; } runLink(url); };
    document.getElementById("ln-go").addEventListener("click", go);
    document.getElementById("ln-in").addEventListener("input", e => e.target.setCustomValidity(""));
    document.getElementById("ln-in").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  },
  analyzing(){ const st = document.getElementById("an-stop"); if (st) st.addEventListener("click", () => { if (idAbort) idAbort.abort(); }); },
  error(){ wireGo(); const r = document.getElementById("er-retry"); if (r) r.addEventListener("click", runPhoto); wireDiagCopy(); },
  result(){
    wireGo();
    const a = draft.ai, L = a.levels;
    // The collector's choice: AI values are kept as AI-sourced, marked as confirmed, never as verified.
    const take = (vals, conf) => {
      for (const [k, v] of Object.entries(vals)){ if (!v) continue; draft.fields[k] = { value:v, source:"photo", confidence:conf[k] ?? 0, confirmed:true }; }
      draft.identification.confirmed = true;
      const m = vals.reference && indexMatch(vals.reference); draft.catalogueId = m && m.catalogueId || null;
      addGo("details");
    };
    addBody.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
      const keep = b.dataset.pick === "all" ? LEVELS : ["brand", "collection", "model"];
      const vals = {}, conf = {}; for (const l of keep) if (L[l].value && L[l].conf > 0){ vals[l] = L[l].value; conf[l] = L[l].conf; }
      if (b.dataset.pick === "noref"){ delete draft.fields.reference; delete draft.fields.variant; }
      take(vals, conf);
    }));
    addBody.querySelectorAll("[data-cand]").forEach(b => b.addEventListener("click", () => {
      const c = a.candidates[+b.dataset.cand];
      take({ brand:c.brand, collection:c.collection, model:c.model, reference:c.reference, variant:c.variant }, { brand:L.brand.conf, collection:L.collection.conf, model:L.model.conf, reference:c.conf, variant:c.conf });
    }));
  },
  search(){
    wireGo();

/* ---------- running the (simulated) identifiers ---------- */
async function climb(results){
  // reveal the hierarchy one level at a time, stopping where confidence runs out

    await wait(420);
    const el = addBody.querySelector(`.rung[data-l="${l}"]`); if (!el) return;
    const k = results ? results[l] ?? 0 : 0;
    el.classList.add(k >= CONFIDENT ? "ok" : k > 0 ? "maybe" : "no");
  }

}
async function runPhoto(){

  const t0 = performance.now(), msg = () => document.getElementById("an-msg"), tm = document.getElementById("an-time");
  const tick = setInterval(() => { if (tm && document.body.contains(tm)) tm.textContent = `${Math.round((performance.now() - t0) / 1000)} s`; }, 1000);
  try {
    const res = await identifyPhotos(stage => { if (stage === "writing" && msg()) msg().textContent = "Writing up the findings"; });
    draft.ai = mergeAI(draft.ai, res); draft.identification.method = "photo-ai";
    const L = draft.ai.levels;
    clearInterval(tick); addBody.querySelector(".ladder")?.classList.remove("thinking");
    await climb(Object.fromEntries(LEVELS.map(l => [l, L[l].conf])));
    draft.identification.status = !draft.ai.isWatch || !L.brand.value ? "unrecognised" : L.reference.conf >= CONFIDENT ? "identified-ai" : "partial";
    addBusy = false; addGo("result");
  } catch (e) {
    clearInterval(tick); addBusy = false;

}
async function runLink(url){

  await climb(res.status === "failed" ? null : conf);

  addBusy = false;
  if (res.status === "failed"){ addGo("details"); toastAdd("Nothing could be read from this address. The link is saved with the watch; add the details yourself."); return; }
  contribute("link", res.fields); if (!draft.identification.method) draft.identification.method = "link";
  if (res.catalogueId) draft.catalogueId = res.catalogueId;

}
function toastAdd(msg){ const t = document.getElementById("addw-toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastAdd.t); toastAdd.t = setTimeout(() => t.hidden = true, 5200); }
async function decodeImage(file){
  try { return await createImageBitmap(file); }
  catch { return await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("decode")); im.src = u; }); }
}
function toJpeg(src, max, q){
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight, s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);

/* ---------- clean-up helpers ---------- */
const KNOWN_BRANDS = [...new Set([...REF_INDEX.map(r => r.brand), ...BRAND_DOMAINS.map(b => b[1]), "Cartier", "Bulgari", "Montblanc", "Bell & Ross", "Girard-Perregaux", "Glashütte Original", "Piaget", "Richard Mille", "Ulysse Nardin", "F.P. Journe", "H. Moser & Cie.", "Oris", "Sinn", "Hamilton", "Baume & Mercier", "Frederique Constant"])];
const fold = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
function canonBrand(v){
  const t = String(v || "").trim(); if (!t) return "";
  const hit = KNOWN_BRANDS.find(b => fold(b) === fold(t)); if (hit) return hit;
  return t === t.toLowerCase() || t === t.toUpperCase() ? t.toLowerCase().replace(/(^|[\s\-&.])(\p{L})/gu, (m, a, c) => a + c.toUpperCase()) : t;
}
// A manufacturer reference is a code like 126610LN or WSSA0018. Labels pasted from shops are removed, never kept.
function cleanRef(v){
  const removed = []; let s = String(v || "");
  s = s.replace(/\b(sku|ref(?:erence)?(?:\s*(?:no|nr|number))?|model\s*(?:no|nr|number)|art(?:icle)?\.?\s*(?:no|nr|number)?|item\s*(?:no|number)?|product\s*code)\b\.?\s*[:#.]?/gi, m => { removed.push(m.replace(/[\s:#.]+$/, "")); return " "; });
  s = s.replace(/[:;#,|]+/g, " ").replace(/\s+/g, " ").trim();
  return { value:s, removed };
}

/* ---------- saving: the draft becomes a collection entry ---------- */
let savedEntry = null;
async function saveDraft(){

      confirmed:draft.identification.confirmed, inIndex:!!idx, fields:draft.fields,
      ai:draft.ai ? { levels:draft.ai.levels, observations:draft.ai.observations, visibleText:draft.ai.visibleText } : null },

// Fixes records saved before the label and reference corrections. Returns true when something changed.
function repairEntry(e){
  let changed = false; const idn = e.identification || {}, d = e.described || {};
  if (idn.method === "photo-ai" && !idn.ai){ idn.method = "manual"; changed = true; }
  const b = canonBrand(d.brand); if (b && b !== d.brand){ d.brand = b; changed = true; }
  const r = cleanRef(d.reference).value; if (r !== (d.reference || "")){ d.reference = r; if (idn.fields && idn.fields.reference) idn.fields.reference.value = r; changed = true; }
  if (idn.fields && idn.fields.brand && b) idn.fields.brand.value = b;
  return changed;
}
const photoSrc = p => p.assetId ? "/_blob/" + p.assetId : p.thumb;

/* =====================================================================
   COLLECTION STORE — unlimited collection, one box (for now), placements by tray/row/column.
   Every watch is a record; `placement` is { boxId, tray, row, col } or null (in the collection, not in the box).
   The box record holds its layout and tray count; more boxes later simply add box records and boxIds.
   Growth: 6 → 8 adds a column, 8 → 12 adds a row, beyond 12 adds trays of 12. Existing positions never move.
   ===================================================================== */
const BOX = { id:"main", kind:"box", name:"Main box", layout:6, trays:1, v:2 };
const LAYOUT_STEPS = [6, 8, 12];
let activeTray = 0, storeMode = "local";
const DEMO_SEED = COLLECTION.filter(e => e && e.slot != null && e.slot < 6).map(e => JSON.parse(JSON.stringify(e)));
const dimsOf = layout => OPTIONS.layouts[layout];
const isPlaced = e => !!(e && e.placement && e.placement.boxId === BOX.id);
const placedAt = (tray, row, col) => COLLECTION.find(e => isPlaced(e) && e.placement.tray === tray && e.placement.row === row && e.placement.col === col) || null;
function entryAt(i){ const L = dimsOf(BOX.layout); return placedAt(activeTray, Math.floor(i / L.cols), i % L.cols); }
function spotLabel(p){ const L = dimsOf(BOX.layout); return `${BOX.trays > 1 ? `Tray ${roman(p.tray)}, ` : ""}compartment ${p.row * L.cols + p.col + 1}`; }
const roman = n => ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"][n] || String(n + 1);
function freeSpots(layout = BOX.layout, trays = BOX.trays){
  const L = dimsOf(layout), out = [];
  for (let t = 0; t < trays; t++) for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) if (!placedAt(t, r, c)) out.push({ tray:t, row:r, col:c });
  return out;
}
// Where a new watch would go, growing the box only as far as needed. Nothing is committed here.
function planPlacement(prefer = null){
  let layout = BOX.layout, trays = BOX.trays;
  if (prefer && !placedAt(prefer.tray, prefer.row, prefer.col)) return { layout, trays, spot:prefer, grew:false };
  let spots = freeSpots(layout, trays);
  while (!spots.length){
    const i = LAYOUT_STEPS.indexOf(layout);
    if (i >= 0 && i < LAYOUT_STEPS.length - 1) layout = LAYOUT_STEPS[i + 1]; else trays++;
    spots = freeSpots(layout, trays);
  }
  return { layout, trays, spot:spots[0], grew:layout !== BOX.layout || trays !== BOX.trays };
}
function growthText(plan){
  if (!plan.grew) return "";
  return plan.trays !== BOX.trays ? `A second layer is added: Tray ${roman(plan.trays - 1)}, with ${plan.layout} compartments.` : `The box grows from ${BOX.layout} to ${plan.layout} compartments. Every watch keeps its place.`;
}
async function commitPlacement(entry, plan, spot = plan.spot){
  if (plan.grew){ BOX.layout = plan.layout; BOX.trays = plan.trays; CONFIG.layout = BOX.layout; await saveDoc("box-" + BOX.id, BOX); }
  entry.placement = { boxId:BOX.id, tray:spot.tray, row:spot.row, col:spot.col };
  await saveDoc(entry.id, entry);
  activeTray = spot.tray; rebuildBox({ settle:true });
}

/* ---------- persistence: the owner's private database, or this browser as a fallback ---------- */
const LOCAL_KEY = "ecrin-store-v2";
function readLocal(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "null") || { docs:{} }; } catch { return { docs:{} }; } }
function writeLocal(st){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(st)); return true; } catch { return false; } }
// Every database call is bounded in time, so a slow or stalled store can never freeze the page.
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code:"timeout", message:"timed out" }), ms))]);
const pause = ms => new Promise(r => setTimeout(r, ms));
async function saveDoc(id, data, { quiet = false } = {}){
  const body = JSON.parse(JSON.stringify(data));
  if (storeMode === "db"){
    const ref = CLAUDE.db.collection(`data/users/${CLAUDE.uid}`).doc(id);
    for (let attempt = 0; attempt < 2; attempt++){
      try { await withTimeout(ref.set(body), 15000); return true; }
      catch (err) {
        console.warn("save", id, err);
        const code = err && err.code;
        if (attempt === 0 && (code === "unavailable" || code === "timeout" || code === "resource_exhausted")){ await pause(1200 + Math.random() * 1500); continue; }
        if (!quiet) toastBox(code === "quota_exceeded" ? "Your private storage is full; this change wasn't saved." : "This change couldn't be saved. Check your connection.");
        return false;
      }
    }
  }
  const st = readLocal(); st.docs[id] = body; if (!writeLocal(st)) toastBox("This browser's storage is full; the change wasn't saved.");
  return true;
}
async function deleteDoc(id){
  if (storeMode === "db"){ try { await withTimeout(CLAUDE.db.collection(`data/users/${CLAUDE.uid}`).doc(id).delete(), 15000); return true; } catch (err) { console.warn(err); return false; } }
  const st = readLocal(); delete st.docs[id]; writeLocal(st); return true;
}
// Older records used a single slot number in a 6-compartment (3 × 2) box. `taken` holds "tray:row:col" keys.
function legacyToPlacement(e, taken){
  if (!("slot" in e)) { if (e.placement === undefined){ e.placement = null; return true; } return false; }
  const s = e.slot; delete e.slot;                      // the old field goes, even when a placement already exists
  if (!e.placement && s != null && s >= 0 && s < 6){     // two old records can claim the same slot: the first keeps it, the other waits in the collection
    const p = { boxId:"main", tray:0, row:Math.floor(s / 3), col:s % 3 }, k = `0:${p.row}:${p.col}`;
    if (!taken.has(k)){ taken.add(k); e.placement = p; return true; }
  }
  if (e.placement === undefined) e.placement = null;
  return true;
}
async function loadCollection(){
  await Promise.race([CLAUDE.ready, new Promise(r => setTimeout(r, 4000))]);
  window.__boot && __boot.mark(`storage ready: db ${CLAUDE.db ? "yes" : "no"}, user ${CLAUDE.uid ? "yes" : "no"}`);
  let docs = [];
  if (CLAUDE.db && CLAUDE.uid){
    try { docs = (await withTimeout(CLAUDE.db.collection(`data/users/${CLAUDE.uid}`).get(), 12000)).docs.map(d => ({ ...d.data(), id:d.data().id || d.id, _doc:d.id })); storeMode = "db"; }
    catch (err) { console.warn(err); setTimeout(() => toastBox("Your collection couldn't be reached just now. Reload to try again."), 1600); }
  }
  window.__boot && __boot.mark(`read ${docs.length} records from ${storeMode}`);
  if (storeMode !== "db") docs = Object.entries(readLocal().docs).map(([id, d]) => ({ ...d, id:d.id || id, _doc:id }));
  docs.forEach(d => delete d._doc);
  const boxDoc = docs.find(d => d.kind === "box");
  let watches = docs.filter(d => d.kind !== "box" && typeof d.id === "string" && d.id.startsWith("w-"));
  const dirty = new Set();
  if (!boxDoc){
    // First run of the collection store: the demo watches become the owner's records; earlier additions are carried over.
    try { for (const e of JSON.parse(localStorage.getItem("ecrin-added") || "[]")) if (!watches.some(w => w.id === e.id)) watches.push(e); } catch {}
    const seed = DEMO_SEED.filter(d => !watches.some(w => w.id === d.id)).map(e => ({ ...JSON.parse(JSON.stringify(e)), demo:true }));
    watches = [...seed, ...watches];
    Object.assign(BOX, { layout:6, trays:1 }); dirty.add("box");
  } else Object.assign(BOX, boxDoc);
  const taken = new Set(watches.filter(e => e.placement).map(e => `${e.placement.tray}:${e.placement.row}:${e.placement.col}`));
  for (const e of watches){ if (legacyToPlacement(e, taken)) dirty.add(e.id); if (repairEntry(e)) dirty.add(e.id); }
  COLLECTION.length = 0; watches.forEach(w => COLLECTION.push(w));
  CONFIG.layout = BOX.layout;
  return [...dirty];
}
// Write the converted records after the box is on screen: watches first, the box record last, so an interrupted
// run simply repeats on the next visit. One write at a time, gently paced; a failure never touches what's shown.
async function persistMigration(dirty){
  let failed = 0;
  const ids = dirty.filter(id => id !== "box").concat(dirty.includes("box") ? ["box"] : []);
  for (const id of ids){
    const ok = await saveDoc(id === "box" ? "box-" + BOX.id : id, id === "box" ? BOX : COLLECTION.find(e => e.id === id), { quiet:true });
    if (!ok){ failed++; if (id === "box") break; }
    await pause(250);
  }
  if (failed) toastBox("Some changes couldn't be saved yet. They'll be saved on your next visit.");
}

/* ---------- editing a watch: the approved details form, filled from the record ---------- */

  for (const k of ["brand", "collection", "model", "reference", "variant"]) if (base[k]) draft.fields[k] = (e.identification && e.identification.fields && e.identification.fields[k]) || { value:base[k], source:c ? "catalogue" : "manual", confidence:1 };
  if (e.owned && e.owned.year) draft.fields.year = { value:String(e.owned.year), source:"manual", confidence:1 };

/* ---------- box rebuild with a quiet "tray settles" motion ---------- */
function rebuildBox({ settle = false } = {}){

  CONFIG.layout = BOX.layout; buildBox(); frameView(true, 1.0); renderDock();
  if (settle) cells.forEach((c, k) => { const y = c.position.y; c.position.y = y + 3.2; tween(0.75 + k * 0.03, easeOut, t => { c.position.y = y + 3.2 * (1 - t); }); });
}

/* ---------- dock: tray switcher, move mode hint, collection button ---------- */
const trayNav = document.getElementById("trays"), moveHint = document.getElementById("move-hint");
function renderDock(){
  trayNav.hidden = BOX.trays < 2;
  trayNav.innerHTML = BOX.trays < 2 ? "" : `<span>Tray</span>${Array.from({ length:BOX.trays }, (_, t) => `<button data-tray="${t}" aria-pressed="${t === activeTray}" aria-label="Tray ${t + 1}">${roman(t)}</button>`).join("")}`;
  trayNav.querySelectorAll("[data-tray]").forEach(b => b.addEventListener("click", () => switchTray(+b.dataset.tray)));
  const out = COLLECTION.filter(e => e && !isPlaced(e)).length;
  document.getElementById("b-coll").textContent = out ? `האוסף · ${out} מחוץ לקופסה` : "האוסף";
}
let toastT = null;
function toastBox(msg){ const t = document.getElementById("box-toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }

/* ---------- rearranging: pick a watch, then a compartment ---------- */
let moving = null;
function startMove(entry){
  moving = entry; unfocus(true);
  moveHint.hidden = false; moveHint.querySelector("span").textContent = `Choose a compartment for ${titleOf(entry).name}`;
  requestRender();
}
function endMove(){ moving = null; moveHint.hidden = true; }
async function moveTo(spot){
  const e = moving; endMove(); if (!e) return;
  const other = placedAt(spot.tray, spot.row, spot.col);
  if (other === e) return;
  const from = e.placement ? { ...e.placement } : null;
  e.placement = { boxId:BOX.id, ...spot };
  if (other){ other.placement = from ? { ...from } : null; await saveDoc(other.id, other); }
  await saveDoc(e.id, e);
  rebuildBox();
  toastBox(other ? (from ? "Swapped places." : "Placed. The watch that was there is now outside the box.") : "Moved.");
}
document.getElementById("move-cancel").addEventListener("click", endMove);
document.getElementById("focus-move").addEventListener("click", () => state.focus && startMove(state.focus.userData.entry));

/* ---------- collection sheet: every watch, in or out of the box ---------- */
const collEl = document.getElementById("coll");
function openCollection(){
  const rows = COLLECTION.filter(Boolean).map(e => { const t = titleOf(e);
    return `<li><button data-id="${esc(e.id)}"><span class="cb">${esc(t.kicker)}</span><span class="cm">${esc(t.name)}</span><span class="cr">${isPlaced(e) ? esc(spotLabel(e.placement)) : "Not in the box"}</span></button>${isPlaced(e) ? "" : `<button class="sec small" data-place="${esc(e.id)}">Place in box</button>`}</li>`; }).join("");
  document.getElementById("coll-body").innerHTML = `<p class="lead">${COLLECTION.filter(Boolean).length} watches · ${COLLECTION.filter(isPlaced).length} in the box</p><ul class="coll-list">${rows}</ul>`;
  collEl.hidden = false; requestAnimationFrame(() => collEl.classList.add("on"));
  collEl.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => { const e = COLLECTION.find(x => x && x.id === b.dataset.id); closeCollection(); showWatch(e); }));
  collEl.querySelectorAll("[data-place]").forEach(b => b.addEventListener("click", async () => { const e = COLLECTION.find(x => x && x.id === b.dataset.place); await placeInBox(e); openCollection(); }));
}
function closeCollection(){ collEl.classList.remove("on"); setTimeout(() => collEl.hidden = true, 300); }
document.getElementById("b-coll").addEventListener("click", openCollection);
document.getElementById("coll-close").addEventListener("click", closeCollection);
// Open a watch: from its compartment when it's in the box, otherwise straight to its passport.
function showWatch(e){
  if (isPlaced(e)){
    if (e.placement.tray !== activeTray){ activeTray = e.placement.tray; rebuildBox(); }
    const cell = cells.find(c => c.userData.entry === e);
    if (cell){ openPassport(cell); return; }
  }
  openPassportFor(e);
}
async function placeInBox(e){
  const plan = planPlacement(); const grew = growthText(plan);
  await commitPlacement(e, plan);
  toastBox(`Placed in ${spotLabel(e.placement)}.${grew ? " " + grew : ""}`);
}

/* ---------- passport management: edit, remove from box / place in box, delete ---------- */
async function removeFromBox(e){ e.placement = null; await saveDoc(e.id, e); rebuildBox(); toastBox("Removed from the box. It stays in your collection."); }
function confirmDelete(e){
  const t = titleOf(e), n = (e.photos || []).filter(p => p.assetId).length, docs = (e.private?.documents || []).length + (e.owned?.documents || []).length;
  const el = document.getElementById("confirm");
  el.querySelector("h2").textContent = `Delete ${[t.kicker === "Awaiting identification" ? "" : t.kicker, t.name].filter(Boolean).join(" ")}?`;
  el.querySelector("p").textContent = `This permanently removes the watch from your collection: its record, ownership details and private information${n ? `, and its ${n} photograph${n > 1 ? "s" : ""}` : ""}${docs ? ` and ${docs} document${docs > 1 ? "s" : ""}` : ""}. It can't be undone.`;
  el.hidden = false; requestAnimationFrame(() => el.classList.add("on"));
  const yes = el.querySelector("#confirm-yes"), no = el.querySelector("#confirm-no");
  const close = () => { el.classList.remove("on"); setTimeout(() => el.hidden = true, 250); yes.onclick = no.onclick = null; };
  no.onclick = close; yes.onclick = async () => { close(); await deleteWatch(e); };
  no.focus();
}
async function deleteWatch(e){
  await CLAUDE.ready;
  if (CLAUDE.assets) for (const p of e.photos || []) if (p.assetId){ try { await CLAUDE.assets.delete(p.assetId); } catch {} }
  const ok = await deleteDoc(e.id);
  if (!ok){ toastBox("The watch couldn't be deleted. Try again."); return; }
  const i = COLLECTION.indexOf(e); if (i >= 0) COLLECTION.splice(i, 1);
  if (passportOpen) closePassport();
  rebuildBox(); toastBox("Deleted from your collection.");
}
document.getElementById("pp-body").addEventListener("click", ev => {
  const b = ev.target.closest("[data-manage]"); if (!b || !passportEntry) return;
  const e = passportEntry, act = b.dataset.manage;
  if (act === "edit") openEdit(e);
  else if (act === "remove") removeFromBox(e).then(() => renderPassport());
  else if (act === "place") placeInBox(e).then(() => renderPassport());
  else if (act === "delete") confirmDelete(e);
});
function manageSection(raw){
  return `<section class="sec" id="manage"><header><span class="sc"></span><h2>Manage</h2></header><div class="body">
    <p class="where">${isPlaced(raw) ? `In the box · ${esc(spotLabel(raw.placement))}` : "In your collection · not in the box"}</p>
    <div class="manage">
      <button class="mg" data-manage="edit"><b>Edit watch</b><span>Brand, model, reference and ownership details.</span></button>
      ${isPlaced(raw) ? `<button class="mg" data-manage="remove"><b>Remove from box</b><span>It stays in your collection, without a compartment.</span></button>`
        : `<button class="mg" data-manage="place"><b>Place in box</b><span>Into the first free compartment. The box grows if it's full.</span></button>`}
      <button class="mg danger" data-manage="delete"><b>Delete watch</b><span>Permanently removes it from your collection.</span></button>
    </div></div></section>`;
}
// Passport opened without a compartment (the watch is outside the box).
function openPassportFor(e){
  passportEntry = e; camBeforePassport = null;
  dissolve.hidden = false; requestAnimationFrame(() => dissolve.classList.add("on"));
  setTimeout(() => {
    renderPassport(); passport.hidden = false; passport.scrollTop = 0; passportOpen = true; heroShow(e, false);
    requestAnimationFrame(() => { passport.classList.add("on"); dissolve.classList.remove("on"); });
    setTimeout(() => { dissolve.hidden = true; }, 700);
  }, 450);
}

/* ============ picking ============ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 450; down = null;
  if (moved > 6 || !quick) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(box, true).filter(h => h.object.material !== M.glass && h.object.material !== M.crystal);
  if (!hits.length){ if (state.focus) unfocus(); return; }
  if (!state.open) return setOpen(true);
  let o = hits[0].object; while (o && !(o.userData && "slot" in o.userData)) o = o.parent;
  if (moving){ if (o && o.userData.pos) moveTo(o.userData.pos); return; }
  if (o && o.userData.watch) focusCell(o); else if (o && o.userData.pos) openAdd(o.userData.pos); else if (state.focus) unfocus();
});

/* ============ render loop (only while something changes) ============ */
let dirty = true;
function requestRender(shadows = false){ dirty = true; if (shadows) renderer.shadowMap.needsUpdate = true; }
controls.addEventListener("change", requestRender);
let firstFrame = true;
function loop(now){
  if (firstFrame){ firstFrame = false; window.__boot && __boot.mark("first frame drawn"); }
  requestAnimationFrame(loop);
  const ticked = tickHands(now);
  if (tweens.length && !passportOpen) renderer.shadowMap.needsUpdate = true;
  for (let i = tweens.length - 1; i >= 0; i--){ const tw = tweens[i], k = Math.min(1, (now - tw.t0) / tw.dur); tw.fn(tw.ease(k)); dirty = true; if (k >= 1) tweens.splice(i, 1); }
  if (passportOpen && hero && !hero.paused){ hero.ctl.update(); hero.r.render(hero.sc, hero.cam); return; }
  if (passportOpen) return;
  if (controls.update() || dirty || ticked){ renderer.render(scene, camera); dirty = false; }
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (!state.focus) frameView(false); requestRender(); });
lidBtn.addEventListener("click", () => setOpen(!state.open));
document.getElementById("b-reset").addEventListener("click", () => { if (state.focus) unfocus(true); frameView(true, 1.1); });
addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!document.getElementById("confirm").hidden) document.getElementById("confirm-no").click(); else if (moving) endMove(); else if (!collEl.hidden) closeCollection(); else if (!addEl.hidden) closeAdd(); else if (passportOpen) closePassport(); else if (state.focus) unfocus(); });

/* ============ start ============ */
async function start(){
  const B = window.__boot || { errors:[], mark(){} }, stage = s => B.mark(s);
  stage("fonts");
  try { await Promise.race([document.fonts.load('400 64px "Bellefair"'), new Promise(r => setTimeout(r, 2000))]); } catch {}
  let pending = [];
  stage("reading your collection");
  try { pending = await loadCollection(); }
  catch (err) {
    console.error("load", err); pending = [];
    if (!COLLECTION.some(e => e.placement !== undefined)){ const taken = new Set(); COLLECTION.length = 0; DEMO_SEED.forEach(d => { const e = JSON.parse(JSON.stringify(d)); legacyToPlacement(e, taken); COLLECTION.push(e); }); }
  }
  stage("building the box"); sharedGeometries(); buildBox();
  stage("controls"); renderDock();
  stage("camera"); frameView(false);
  stage("preparing materials"); try { renderer.compile(scene, camera); } catch (err) { B.errors.push("compile: " + (err && err.message || err)); }
  stage("first frame"); requestAnimationFrame(loop);
  document.getElementById("veil").style.opacity = 0;
  B.done = Date.now(); stage("done: box shown");
  renderer.domElement.addEventListener("webglcontextlost", () => { B.errors.push("the graphics context was lost (device memory)"); stage("drawing"); __bootShow(); });
  setTimeout(() => { if (!state.open) setOpen(true); }, 1400);
  if (pending.length) setTimeout(() => persistMigration(pending), 1500);
  window.__ecrin = { camera, controls, box:() => box, CONFIG, applyConfig, buildBox, setOpen, focusCell, openPassport, closePassport, cells:() => cells, hero:() => hero, openAdd, COLLECTION, BOX, switchTray, startMove, moveTo, placeInBox, removeFromBox, deleteWatch, confirmDelete, openEdit, openCollection, showWatch, planPlacement, isPlaced, setViewer:x => { viewer = x; renderPassport(); }, requestRender, M, scene, frameView };
}
start().catch(err => { const B = window.__boot; if (B){ B.errors.push("start: " + (err && (err.stack || err.message) || err)); __bootShow(); } console.error(err); });
</script>
